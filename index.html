@media(max-width:1180px){.app{grid-template-columns:330px 1fr;grid-template-rows:1fr 360px;height:auto;min-height:100vh;overflow:visible}.rightPane{grid-column:1/3;grid-row:2;grid-template-columns:1.1fr 1fr;grid-template-rows:auto 1fr;overflow:auto}.rightPane>.box:nth-child(3){grid-row:1/3}.rightPane>.box:nth-child(4){grid-column:2}.rightPane>.box:nth-child(5){grid-column:2}}

/* --- visual refinement patch --- */
:root{
  --ink:#343331;--muted:#77705f;--line:#ddd2b4;
  --bg:#f3efe2;--panel:#fffdf7;--panel2:#f7f0d7;
  --sidebar:#25231f;--sidebar2:#2d2a24;--sidebar3:#363125;
  --light:#ede0c2;--dark:#b98a5a;
}
.left{background:var(--sidebar);border-color:#1f1d19;color:#eee9db}.brand{background:#211f1b;border-bottom:1px solid #3b3528}.status{background:#27241f;border-bottom:1px solid #3b3528;color:#bdb4a1}.gameList{background:var(--sidebar);padding:6px}.gameCard{grid-template-columns:3px 1fr;background:transparent;border:1px solid transparent;border-radius:10px;margin:0 0 5px 0}.gameCard:hover{background:#302c24;border-color:#453d2f}.gameCard.active{background:#3c3526;border-color:#6d5b2f}.cardBody{padding:9px 10px}.resultBadge{border-radius:999px;padding:3px 8px;letter-spacing:.02em}.chip{background:#353126;border-color:#4b4332;color:#cfc6b5;border-radius:999px}.playerRow{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center}.playerName{color:#d9d3c4}.playerName.self{color:#fff;font-weight:950}.sideIcon{font-size:11px;line-height:1;color:#cfc6b5}.sideIcon.white{color:#f2f0e8}.sideIcon.black{color:#181818;text-shadow:0 0 0 #181818}.search input{background:#f9f5e8!important;color:#343331!important;border-color:#5a503c!important;caret-color:#343331}.search input::placeholder{color:#746b59!important;opacity:1}.search input:focus{background:#fffaf0!important;border-color:#ffd54a!important}.gameHeader{background:linear-gradient(180deg,#fff6c8,#fffdf7)}.boxHead{background:#f1e6bd}.boardWrap{border-color:#8c6840;background:#b98a5a}.piece{font-family:"DejaVu Sans","Noto Sans Symbols 2","Segoe UI Symbol","Arial Unicode MS",sans-serif!important;font-size:calc(var(--board)/10.9)!important;font-weight:400!important;line-height:1!important;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;text-shadow:none!important;-webkit-text-stroke:0!important;paint-order:normal;pointer-events:none}.piece.white{color:#f7f7f7!important;filter:drop-shadow(0 1px 1px rgba(35,28,18,.55))}.piece.black{color:#262421!important;filter:drop-shadow(0 1px 1px rgba(255,255,255,.18))}.sq{cursor:default}.branchMode .sq{cursor:pointer}.branchMode .sq:active{filter:brightness(.98)}#boardMarks{position:absolute;inset:0;z-index:9;pointer-events:none}.mark{pointer-events:none}.arrowSvg{z-index:8}.moveBtn{background:#f5efd8;color:#3b372d}.moveBtn.active{background:#ffd54a;color:#343331}.branchHint{background:#eef7e8;border-color:#a9d1a8;color:#365c32}.errLine{color:#9e332e}

<body>
<div class="app">
  <section class="pane left">
    <div class="brand">
      <div class="logo"><span class="logoMark">♞</span><span>棋譜ビューア</span></div>
      <div class="search"><input id="userInput" placeholder="Chess.com username" autocomplete="off"><button id="searchBtn">検索</button></div>
    </div>
    <div id="status" class="status">ユーザー名を入力してください。</div>
    <div id="gameList" class="gameList"></div>
    <div class="loadMore"><button id="moreBtn" disabled>さらに読み込み</button></div>
  </section>

  <section class="pane boardPane">
    <div class="gameHeader">
      <div><div id="gameTitle" class="gameTitle">棋譜未選択</div><div id="gameSub" class="gameSub">検索結果またはPGN貼り付けから読み込めます。</div></div>
      <div class="topBtns"><button id="copyBtn" class="mini ghost" disabled>PGNコピー</button><a id="openLink" class="hidden linkBtn" target="_blank" rel="noopener"><button class="mini ghost">Chess.comで開く</button></a></div>
    </div>
    <div class="mainBoard">
      <div id="empty" class="empty">左の棋譜カードをクリック、またはPGNを貼り付けてください。</div>
      <div id="boardArea" class="hidden">
        <div class="boardStage">
          <div class="evalBar"><div id="evalWhite" class="evalWhite"></div></div>
          <div id="boardWrap" class="boardWrap"><div id="board" class="board"></div><svg id="arrowSvg" class="arrowSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="boardMarks"></div></div>
        </div>
        <div class="controls"><button id="firstBtn">最初へ</button><button id="prevBtn">前へ</button><button id="nextBtn">次へ</button><button id="lastBtn">最後へ</button><button id="flipBtn" class="ghost">反転</button><button id="branchBtn" class="ghost">分析盤</button><button id="analyzeBtn">解析</button><button id="stopBtn" class="danger" disabled>停止</button></div>
      </div>
    </div>
  </section>

  <aside class="pane rightPane">
    <div class="moveInfo"><span id="plyInfo">0 / 0</span><span id="turnInfo" class="chip">開始局面</span></div>
    <div id="errLine" class="errLine"></div>

    <section class="box">
      <div class="boxHead"><span>解析</span><span id="sfState" class="note">未解析</span></div>
      <div class="boxBody">
        <div class="sfRow"><select id="depthSel"><option value="6">depth 6</option><option value="8" selected>depth 8</option><option value="10">depth 10</option></select><span id="percentText" class="note">0%</span><div class="progress"><i id="progressBar"></i></div></div>
        <div class="analysisGrid" style="margin-top:8px">
          <div class="cell"><b>評価</b><span id="evalText">-</span></div><div class="cell"><b>自分目線</b><span id="selfEvalText">-</span></div>
          <div class="cell"><b>最善手</b><span id="bestText">-</span></div><div class="cell"><b>分類</b><span id="qualityText" class="quality">-</span></div>
        </div>
        <div id="detailText" class="note" style="margin-top:6px"></div>
      </div>
    </section>

    <section class="box">
      <div class="boxHead"><span>手順</span><span id="moveCount" class="note">0手</span></div>
      <div id="moves" class="boxBody moves"></div>
    </section>

    <section class="box">
      <div class="boxHead"><span>解析キュー</span><span id="queueCount" class="note">0件</span></div>
      <div id="queueList" class="boxBody queueList"></div>
    </section>

    <section class="box">
      <div class="boxHead"><span>解析済み</span><button id="clearCacheBtn" class="mini danger">全削除</button></div>
      <div class="boxBody"><div id="cacheSize" class="note" style="margin-bottom:6px">0件</div><div id="cacheList" class="cacheList"></div></div>
    </section>

    <section class="box">
      <div class="boxHead disclosure" id="pgnToggle"><span>PGN貼り付け</span><span id="pgnToggleText">開く</span></div>
      <div id="pgnBody" class="boxBody hidden"><div class="pgnBox"><textarea id="pgnInput" placeholder="PGNを貼り付け"></textarea><div class="pgnActions"><button id="loadPgnBtn">PGNを読み込む</button><button id="clearPgnBtn" class="ghost">消去</button></div></div></div>
    </section>
  </aside>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const U={unicode:{P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};
const pieceVal={P:100,N:320,B:330,R:500,Q:900,K:0};
const state={username:'',archives:[],archiveIndex:0,games:[],shown:0,selected:null,viewer:null,ply:0,flipped:false,currentPgn:'',currentUrl:'',currentKey:'',searching:false,analysis:null,queue:[],processing:false,stop:false,sf:null,sfReady:false,sfBusy:false,branch:null,branchEdit:false,branchFrom:null};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setStatus(msg,err=false){$('status').textContent=msg;$('status').classList.toggle('err',err)}
function setErr(msg){$('errLine').textContent=msg||''}
function norm(s){return String(s||'').trim().toLowerCase()}
function fmtDate(ts){return ts?new Date(ts*1000).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'pgn_'+(h>>>0).toString(36)}
function resultFor(game,user){const u=norm(user),w=game.white||{},b=game.black||{};const isW=norm(w.username)===u,isB=norm(b.username)===u;if(!isW&&!isB)return {label:'不明',cls:'draw',side:'?'};const me=isW?w:b,op=isW?b:w;const r=String(me.result||'').toLowerCase(),or=String(op.result||'').toLowerCase();const draw=new Set(['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient']);const loss=new Set(['checkmated','resigned','timeout','abandoned']);if(r==='win')return {label:'勝ち',cls:'win',side:isW?'白番':'黒番'};if(or==='win')return {label:'負け',cls:'loss',side:isW?'白番':'黒番'};if(draw.has(r)||draw.has(or))return {label:'引分',cls:'draw',side:isW?'白番':'黒番'};if(loss.has(r))return {label:'負け',cls:'loss',side:isW?'白番':'黒番'};if(loss.has(or))return {label:'勝ち',cls:'win',side:isW?'白番':'黒番'};return {label:'引分',cls:'draw',side:isW?'白番':'黒番'}}
function opponent(game,user){const u=norm(user);return norm(game.white?.username)===u?game.black?.username:game.white?.username}
async function searchUser(){const u=$('userInput').value.trim();if(!u)return setStatus('ユーザー名を入力してください。',true);state.username=u;state.games=[];state.shown=0;state.archiveIndex=0;state.selected=null;renderList();setStatus('アーカイブ取得中...');try{const r=await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(u)}/games/archives`);if(!r.ok)throw new Error('ユーザーまたはアーカイブを取得できません。');const j=await r.json();state.archives=(j.archives||[]).slice().reverse();await loadMore()}catch(e){setStatus(e.message||'取得に失敗しました。',true)}}

function simpleAnalyze(){if(!state.viewer)return;const moves=[];for(let i=0;i<state.viewer.moves.length;i++){const before=state.viewer.positions[i],after=state.viewer.positions[i+1],mv=state.viewer.moves[i];const e0=evalMaterial(before),e1=evalMaterial(after);const side=before.turn;const delta=(side==='w'?e1-e0:e0-e1);const best=bestHeuristic(before);let quality='good';if(delta<-350)quality='blunder';else if(delta<-180)quality='mistake';else if(delta<-80)quality='inaccuracy';moves.push({eval:e1,best:best?uci(best):'',quality})}state.analysis={key:state.currentKey,title:$('gameTitle').textContent,source:'簡易解析',depth:0,created:Date.now(),done:false,root:{eval:evalMaterial(state.viewer.positions[0]),best:bestHeuristic(state.viewer.positions[0])?uci(bestHeuristic(state.viewer.positions[0])):''},moves};saveCache(state.analysis);renderAll();renderCacheList()}
function evalMaterial(ch){let s=0;for(const p of ch.board){if(!p)continue;const v=pieceVal[p.toUpperCase()]||0;s+=p===p.toUpperCase()?v:-v}return s}

function ensureStockfish(){return new Promise((resolve,reject)=>{if(state.sfReady&&state.sf)return resolve();try{const src='https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js';state.sf=new Worker(src);let ok=false;const t=setTimeout(()=>{if(!ok)reject(new Error('Stockfish timeout'))},6000);state.sf.onmessage=e=>{const line=String(e.data||'');if(line.includes('uciok')){ok=true;clearTimeout(t);state.sfReady=true;resolve()}};state.sf.onerror=()=>reject(new Error('Stockfish load failed'));state.sf.postMessage('uci')}catch(e){reject(e)}})}

async function stockfishAnalyze(q){$('stopBtn').disabled=false;$('sfState').textContent='Stockfish解析中';let analysis=loadCache(q.key)||{key:q.key,title:q.title,source:'Stockfish',created:Date.now(),moves:[]};analysis.source='Stockfish';analysis.depth=q.depth;analysis.done=false;analysis.title=q.title;analysis.moves=analysis.moves||[];const n=q.viewer.moves.length;for(let i=0;i<n;i++){if(state.stop)throw new Error('stopped');const pct=Math.round(i/Math.max(1,n)*100);$('progressBar').style.width=pct+'%';$('percentText').textContent=pct+'%';$('sfState').textContent=`Stockfish ${i}/${n}`;const before=q.viewer.positions[i];const actual=q.viewer.moves[i];const res=await analyzeFen(before.fen(),q.depth);const best=parseUci(res.best);let ql='good';if(best&&!(best.from===actual.from&&best.to===actual.to&&(best.promotion||'')===(actual.promotion||''))){const simp=analysis.moves[i]?.quality;ql=simp&&simp!=='good'?simp:'inaccuracy'}analysis.moves[i]={...(analysis.moves[i]||{}),eval:res.eval,best:res.best,quality:ql};if(i===0)analysis.root={eval:res.eval,best:res.best};saveCache(analysis);if(q.key===state.currentKey){state.analysis=analysis;renderAll()}}analysis.done=true;analysis.created=Date.now();saveCache(analysis);if(q.key===state.currentKey){state.analysis=analysis;renderAll()}$('sfState').textContent='Stockfish完了';$('progressBar').style.width='100%';$('percentText').textContent='100%';$('stopBtn').disabled=true;renderCacheList()}

function onSquareClick(idx){if(!state.branchEdit||!state.viewer)return;const pos=currentEditablePosition();if(!pos)return;const pc=pos.board[idx];if(state.branchFrom==null){if(pc){if(pos.color(pc)===pos.turn){state.branchFrom=idx;renderAll()}else setErr('現在は'+(pos.turn==='w'?'白':'黒')+'番です。分析盤では番の駒を動かしてください。')}return}const legal=pos.legal().filter(m=>m.from===state.branchFrom);let mv=legal.find(m=>m.to===idx);if(!mv&&pc&&pos.color(pc)===pos.turn){state.branchFrom=idx;renderAll();return}if(!mv){state.branchFrom=null;renderAll();return}appendBranchMove(mv)}

function moveUci(ch,u){const p=parseUci(u);if(!p)return null;return ch.legal().find(m=>m.from===p.from&&m.to===p.to&&((m.promotion||'')===(p.promotion||'')||(!m.promotion&&!p.promotion)))||null}
function cacheKey(k){return 'cv_analysis_'+k}function saveCache(a){try{localStorage.setItem(cacheKey(a.key),JSON.stringify(a));pruneCache()}catch{setErr('解析結果の保存容量が不足しています。')}}function loadCache(k){try{return JSON.parse(localStorage.getItem(cacheKey(k))||'null')}catch{return null}}
function allCaches(){const arr=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('cv_analysis_')){try{const v=JSON.parse(localStorage.getItem(k));if(v)arr.push(v)}catch{}}}return arr.sort((a,b)=>(b.created||0)-(a.created||0))}
function pruneCache(){const arr=allCaches();arr.slice(30).forEach(a=>localStorage.removeItem(cacheKey(a.key)))}
function renderCacheList(){const arr=allCaches();$('cacheSize').textContent=`${arr.length}件 / 約${Math.round(JSON.stringify(arr).length/1024)}KB`;const box=$('cacheList');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="note">解析済みはありません。</div>';return}arr.forEach(a=>{const d=document.createElement('div');d.className='smallItem'+(a.key===state.currentKey?' active':'');d.innerHTML=`<div><div class="smallTitle">${escapeHtml(a.title||a.key)}</div><div class="smallSub">${escapeHtml(a.source||'解析')} ${a.depth?('depth '+a.depth):''} ${new Date(a.created||Date.now()).toLocaleString('ja-JP')}</div></div>`;const btn=document.createElement('button');btn.className='mini danger';btn.textContent='削除';btn.onclick=()=>{localStorage.removeItem(cacheKey(a.key));if(a.key===state.currentKey)state.analysis=null;renderCacheList();renderAll()};d.appendChild(btn);box.appendChild(d)})}
function clearAllCache(){if(!confirm('解析結果をすべて削除しますか？'))return;allCaches().forEach(a=>localStorage.removeItem(cacheKey(a.key)));state.analysis=null;renderCacheList();renderAll()}
function parsePGN(pgn){if(!pgn||!pgn.trim())throw new Error('PGNが空です。');const headers={};pgn.replace(/^\s*\[([^\s]+)\s+"([^"]*)"\]\s*$/gm,(_,k,v)=>{headers[k]=v;return''});const tokens=tokenizeMoves(stripHeaders(pgn)).filter(x=>!isResult(x)&&!/^\$\d+$/.test(x));return {headers,tokens,raw:pgn}}
function stripHeaders(pgn){return pgn.replace(/^\s*\[[^\n]*\]\s*$/gm,' ')}
function tokenizeMoves(s){let prev;do{prev=s;s=s.replace(/\([^()]*\)/g,' ')}while(s!==prev);s=s.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ').replace(/\d+\.(\.\.)?/g,' ');return s.split(/\s+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\d+\.+/,''))}
function isResult(t){return /^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)}
function buildViewer(parsed){let c=new Chess();const positions=[c.clone()],moves=[];for(const san of parsed.tokens){const mv=c.moveSAN(san);moves.push({...mv,san});positions.push(c.clone())}return {positions,moves,headers:parsed.headers}}
class Chess{constructor(){this.board=Array(64).fill(null);this.turn='w';this.castle={K:true,Q:true,k:true,q:true};this.ep=-1;this.full=1;this.setup()}setup(){const back='RNBQKBNR';for(let f=0;f<8;f++){this.board[f]=back[f];this.board[8+f]='P';this.board[48+f]='p';this.board[56+f]=back[f].toLowerCase()}}clone(){const c=new Chess();c.board=this.board.slice();c.turn=this.turn;c.castle={...this.castle};c.ep=this.ep;c.full=this.full;return c}color(p){return !p?null:p===p.toUpperCase()?'w':'b'}enemy(){return this.turn==='w'?'b':'w'}inb(r,f){return r>=0&&r<8&&f>=0&&f<8}rf(i){return [Math.floor(i/8),i%8]}idx(r,f){return r*8+f}kingSq(col=this.turn){const k=col==='w'?'K':'k';return this.board.findIndex(x=>x===k)}attacked(sq,by){for(const m of this.pseudo(by,true))if(m.to===sq)return true;return false}inCheck(col=this.turn){return this.attacked(this.kingSq(col),col==='w'?'b':'w')}inCheckSquare(){return this.inCheck(this.turn)?this.kingSq(this.turn):-1}legal(){return this.pseudo(this.turn,false).filter(m=>{const c=this.clone();c.apply(m);return !c.inCheck(this.turn)})}pseudo(col=this.turn,attackOnly=false){const res=[];for(let i=0;i<64;i++){const p=this.board[i];if(!p||this.color(p)!==col)continue;const type=p.toUpperCase(),[r,f]=this.rf(i),dir=col==='w'?1:-1;const add=(to,extra={})=>{const cap=this.board[to];if(cap&&this.color(cap)===col)return;res.push({from:i,to,piece:type,capture:!!cap,...extra})};if(type==='P'){for(const df of[-1,1]){const nr=r+dir,nf=f+df;if(this.inb(nr,nf)){const to=this.idx(nr,nf);if(this.board[to]&&this.color(this.board[to])!==col){if(nr===0||nr===7)for(const pr of['Q','R','B','N'])res.push({from:i,to,piece:'P',capture:true,promotion:pr});else add(to)}else if(to===this.ep)res.push({from:i,to,piece:'P',capture:true,ep:true})}}if(attackOnly)continue;const nr=r+dir;if(this.inb(nr,f)){const one=this.idx(nr,f);if(!this.board[one]){if(nr===0||nr===7)for(const pr of['Q','R','B','N'])res.push({from:i,to:one,piece:'P',promotion:pr});else add(one);const start=col==='w'?1:6,two=this.idx(r+2*dir,f);if(r===start&&!this.board[two])res.push({from:i,to:two,piece:'P',dbl:true})}}}else if(type==='N'){for(const [dr,df]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){const nr=r+dr,nf=f+df;if(this.inb(nr,nf))add(this.idx(nr,nf))}}else if(type==='B'||type==='R'||type==='Q'){const dirs=[];if(type!=='R')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);if(type!=='B')dirs.push([1,0],[-1,0],[0,1],[0,-1]);for(const[dr,df]of dirs){let nr=r+dr,nf=f+df;while(this.inb(nr,nf)){const to=this.idx(nr,nf),cap=this.board[to];if(!cap)add(to);else{if(this.color(cap)!==col)add(to);break}nr+=dr;nf+=df}}}else if(type==='K'){for(const dr of[-1,0,1])for(const df of[-1,0,1])if(dr||df){const nr=r+dr,nf=f+df;if(this.inb(nr,nf))add(this.idx(nr,nf))}if(!attackOnly&&!this.inCheck(col)){if(col==='w'&&r===0&&f===4){if(this.castle.K&&!this.board[5]&&!this.board[6]&&!this.attacked(5,'b')&&!this.attacked(6,'b'))res.push({from:4,to:6,piece:'K',castle:'K'});if(this.castle.Q&&!this.board[1]&&!this.board[2]&&!this.board[3]&&!this.attacked(3,'b')&&!this.attacked(2,'b'))res.push({from:4,to:2,piece:'K',castle:'Q'})}if(col==='b'&&r===7&&f===4){if(this.castle.k&&!this.board[61]&&!this.board[62]&&!this.attacked(61,'w')&&!this.attacked(62,'w'))res.push({from:60,to:62,piece:'K',castle:'K'});if(this.castle.q&&!this.board[57]&&!this.board[58]&&!this.board[59]&&!this.attacked(59,'w')&&!this.attacked(58,'w'))res.push({from:60,to:58,piece:'K',castle:'Q'})}}}}return res}apply(m){const p=this.board[m.from],col=this.color(p),target=this.board[m.to];this.board[m.from]=null;if(m.ep){const[r,f]=this.rf(m.to);this.board[this.idx(r+(col==='w'?-1:1),f)]=null}if(m.castle){if(m.to===6){this.board[5]='R';this.board[7]=null}else if(m.to===2){this.board[3]='R';this.board[0]=null}else if(m.to===62){this.board[61]='r';this.board[63]=null}else if(m.to===58){this.board[59]='r';this.board[56]=null}}this.board[m.to]=m.promotion?(col==='w'?m.promotion:m.promotion.toLowerCase()):p;if(p==='K'){this.castle.K=false;this.castle.Q=false}if(p==='k'){this.castle.k=false;this.castle.q=false}if(m.from===0||m.to===0)this.castle.Q=false;if(m.from===7||m.to===7)this.castle.K=false;if(m.from===56||m.to===56)this.castle.q=false;if(m.from===63||m.to===63)this.castle.k=false;this.ep=m.dbl?m.from+(col==='w'?8:-8):-1;this.turn=this.enemy();if(col==='b')this.full++;return target}cleanSAN(s){return s.replace(/[!?]+/g,'').replace(/[+#]+$/,'').replace(/ e\.p\.$/,'')}moveSAN(san){let s=this.cleanSAN(san);let promo=null;const pm=s.match(/=([QRBN])/);if(pm){promo=pm[1];s=s.replace(/=([QRBN])/,'')}let legal=this.legal(),chosen=null;if(s==='O-O'||s==='0-0')chosen=legal.find(m=>m.castle==='K');else if(s==='O-O-O'||s==='0-0-0')chosen=legal.find(m=>m.castle==='Q');else{const dest=s.match(/([a-h][1-8])$/);if(!dest)throw new Error('SAN解析エラー: '+san);const to=alg(dest[1]);let head=s.slice(0,s.length-2);const capture=head.includes('x');head=head.replace('x','');let piece='P';if(/^[KQRBN]/.test(head)){piece=head[0];head=head.slice(1)}const dis=head;legal=legal.filter(m=>m.to===to&&m.piece===piece&&(promo?m.promotion===promo:(!m.promotion||m.promotion==='Q')));if(capture)legal=legal.filter(m=>m.capture);if(dis)legal=legal.filter(m=>{const[r,f]=this.rf(m.from);return dis.split('').every(ch=>/[a-h]/.test(ch)?f==='abcdefgh'.indexOf(ch):r===Number(ch)-1)});chosen=legal[0]}if(!chosen)throw new Error('合法手を特定できません: '+san);this.apply(chosen);return chosen}fen(){let rows=[];for(let r=7;r>=0;r--){let row='',e=0;for(let f=0;f<8;f++){const p=this.board[r*8+f];if(p){if(e){row+=e;e=0}row+=p}else e++}if(e)row+=e;rows.push(row)}let cast=Object.entries(this.castle).filter(x=>x[1]).map(x=>x[0]).join('')||'-';return `${rows.join('/')} ${this.turn} ${cast} ${this.ep>=0?sqName(this.ep):'-'} 0 ${this.full}`}}
function alg(a){return(Number(a[1])-1)*8+'abcdefgh'.indexOf(a[0])}

function boardIndexFromEvent(e){const el=document.elementFromPoint(e.clientX,e.clientY);const sq=el?.closest?.('.sq');return sq?Number(sq.dataset.idx):null}
function tryBranchMove(from,to){if(!state.branchEdit||!state.viewer||from==null||to==null)return false;const pos=currentEditablePosition();if(!pos)return false;const pc=pos.board[from];if(!pc||pos.color(pc)!==pos.turn)return false;const mv=pos.legal().filter(m=>m.from===from).find(m=>m.to===to);if(!mv)return false;appendBranchMove(mv);return true}
let dragFrom=null;
$('boardWrap').addEventListener('pointerdown',e=>{if(!state.branchEdit||!state.viewer)return;const idx=boardIndexFromEvent(e);if(idx==null)return;const pos=currentEditablePosition();const pc=pos?.board[idx];if(pc&&pos.color(pc)===pos.turn){dragFrom=idx;state.branchFrom=idx;renderAll();try{$('boardWrap').setPointerCapture(e.pointerId)}catch{}e.preventDefault()}});
$('boardWrap').addEventListener('pointerup',e=>{if(!state.branchEdit||dragFrom==null)return;const to=boardIndexFromEvent(e);const from=dragFrom;dragFrom=null;try{$('boardWrap').releasePointerCapture(e.pointerId)}catch{}if(to!=null&&to!==from){if(!tryBranchMove(from,to)){state.branchFrom=null;renderAll()}}e.preventDefault()});

$('searchBtn').onclick=searchUser;$('moreBtn').onclick=loadMore;$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchUser()});$('firstBtn').onclick=navFirst;$('prevBtn').onclick=navPrev;$('nextBtn').onclick=navNext;$('lastBtn').onclick=navLast;$('flipBtn').onclick=()=>{state.flipped=!state.flipped;renderAll()};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(state.currentPgn);setErr('PGNをコピーしました。');setTimeout(()=>setErr(''),1200)}catch{setErr('コピーできませんでした。')}};$('loadPgnBtn').onclick=()=>loadViewer($('pgnInput').value,'',null);$('clearPgnBtn').onclick=()=>{$('pgnInput').value=''};$('branchBtn').onclick=startBranchAnalysis;$('analyzeBtn').onclick=enqueueAnalysis;$('stopBtn').onclick=()=>{state.stop=true;stopStockfish()};$('clearCacheBtn').onclick=clearAllCache;$('pgnToggle').onclick=()=>{$('pgnBody').classList.toggle('hidden');$('pgnToggleText').textContent=$('pgnBody').classList.contains('hidden')?'開く':'閉じる'};window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(!state.viewer)return;if(e.key==='ArrowLeft'){e.preventDefault();navPrev()}if(e.key==='ArrowRight'){e.preventDefault();navNext()}if(e.key==='ArrowUp'){e.preventDefault();navFirst()}if(e.key==='ArrowDown'){e.preventDefault();navLast()}if(e.key==='Home'){e.preventDefault();navFirst()}if(e.key==='End'){e.preventDefault();navLast()}if(e.key.toLowerCase()==='f'){e.preventDefault();state.flipped=!state.flipped;renderAll()}});renderCacheList();renderQueue();
</script>
