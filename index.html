<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yellow Chess Reviewer</title>
  <meta name="theme-color" content="#FFD54A" />
  <link rel="icon" href="./icon.png" />
  <style>
    :root{
      --yellow:#FFD54A; --yellow2:#FFE27A; --ink:#333333; --muted:#717171;
      --bg:#fffaf0; --card:#ffffff; --line:#e7dcc2; --soft:#fff3c3;
      --good:#2f7d46; --bad:#a83a35; --mid:#9a6a00;
      --shadow:0 12px 32px rgba(70,52,0,.12); --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#fff7d6,#fffaf0 260px,#f7f3ea);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}
    button{border:0;cursor:pointer;color:var(--ink)}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,250,240,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .top-inner{display:flex;gap:12px;align-items:center;padding:12px 16px;max-width:1280px;margin:auto}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
    .logo{width:34px;height:34px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.05)}
    .search{display:flex;gap:8px;align-items:center;flex:1;max-width:560px}
    .search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:white;outline:none;box-shadow:inset 0 1px 0 rgba(0,0,0,.03)}
    .search input:focus{border-color:#d4a900;box-shadow:0 0 0 3px rgba(255,213,74,.35)}
    .primary{background:var(--yellow);padding:12px 16px;border-radius:14px;font-weight:800;box-shadow:0 5px 0 #d5ab1a}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #d5ab1a}
    .ghost{background:white;border:1px solid var(--line);padding:10px 12px;border-radius:13px;font-weight:700}
    .wrap{max-width:1280px;margin:18px auto;padding:0 16px 34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel h2{display:flex;justify-content:space-between;align-items:center;margin:0;padding:14px 16px;background:linear-gradient(180deg,#fff,#fff8dc);border-bottom:1px solid var(--line);font-size:18px}.list{display:grid;gap:10px;padding:12px;min-height:180px}.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center}.game-card{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;transition:.15s;position:relative}.game-card:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(70,52,0,.10);border-color:#d9be64}.game-main{display:flex;justify-content:space-between;gap:10px;align-items:start}.players{font-weight:850;line-height:1.35}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:12px;padding:7px 10px;border-radius:999px;background:#f3efe5;border:1px solid var(--line);font-weight:750}.analyze{background:var(--yellow);border-color:#dfbd32}.done{background:#e3f5e8;color:#225d34;border-color:#b9dfc5}.fail{background:#fde4e1;color:#8b2823}.load-more{margin:0 12px 12px;width:calc(100% - 24px);background:#fff;border:1px dashed #cfb45c;border-radius:14px;padding:11px;font-weight:850}.workspace{margin-top:16px;display:grid;grid-template-columns:minmax(310px,520px) 1fr;gap:16px;align-items:start}.board-panel,.analysis-panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.section-title{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);background:#fffdf4;font-weight:900;display:flex;justify-content:space-between;gap:10px;align-items:center}.board-wrap{padding:14px}.board{width:min(100%,492px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);border-radius:14px;overflow:hidden;border:1px solid #c9b882;background:#ddd}.sq{display:grid;place-items:center;font-size:clamp(24px,6vw,46px);user-select:none;position:relative}.light{background:#f3e5bd}.dark{background:#b98b55}.sq.last::after{content:"";position:absolute;inset:0;background:rgba(255,213,74,.45)}.coord{position:absolute;left:4px;bottom:2px;font-size:10px;font-weight:800;color:rgba(40,30,0,.65)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.moves{padding:12px;max-height:280px;overflow:auto;display:flex;gap:6px;flex-wrap:wrap}.move-pill{background:#f4f0e5;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}.move-pill.active{background:var(--yellow);border-color:#d6ad23;font-weight:850}.details{padding:14px;display:grid;gap:12px}.evalbar{height:16px;border-radius:99px;overflow:hidden;background:#333;display:flex;border:1px solid #c7b77e}.evalwhite{background:#f6f2e8;height:100%;transition:.2s}.evaltext{font-weight:850}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:850;background:#eee}.badge.Best,.badge.Excellent{background:#e3f5e8;color:var(--good)}.badge.Good{background:#eef4ff;color:#315c8c}.badge.Inaccuracy{background:#fff2c2;color:var(--mid)}.badge.Mistake,.badge.Blunder{background:#fde4e1;color:var(--bad)}.toast{position:fixed;right:16px;bottom:16px;z-index:20;display:grid;gap:8px}.toast div{background:#333;color:#fff;padding:12px 14px;border-radius:14px;box-shadow:var(--shadow)}.settings{display:flex;gap:8px;align-items:center;margin-left:auto}.api-input{width:260px;padding:9px 10px;border:1px solid var(--line);border-radius:12px}.hidden{display:none!important}
    @media(max-width:900px){.grid,.workspace{grid-template-columns:1fr}.top-inner{flex-wrap:wrap}.search{order:2;max-width:none;width:100%}.settings{order:3;margin-left:0;width:100%}.api-input{width:100%}.board{margin:auto}.game-main{display:grid}.brand span{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><div class="logo">♟</div><span>Yellow Chess Reviewer</span></div>
      <form class="search" id="searchForm">
        <input id="username" autocomplete="off" placeholder="Chess.com / Lichess のユーザー名" />
        <button class="primary" type="submit">検索</button>
      </form>
      <div class="settings">
        <input class="api-input" id="apiBase" placeholder="API URL 例: http://localhost:3000" />
        <button class="ghost" id="saveApi" type="button">API保存</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="grid">
      <section class="panel">
        <h2>Chess.com <span id="chesscomStatus" class="meta">未検索</span></h2>
        <div id="chesscomList" class="list"><div class="empty">ユーザー名を検索してください</div></div>
        <button id="moreChesscom" class="load-more hidden">さらに読み込み</button>
      </section>
      <section class="panel">
        <h2>Lichess <span id="lichessStatus" class="meta">未検索</span></h2>
        <div id="lichessList" class="list"><div class="empty">ユーザー名を検索してください</div></div>
        <button id="moreLichess" class="load-more hidden">さらに読み込み</button>
      </section>
    </div>

    <section class="workspace">
      <div class="board-panel">
        <div class="section-title"><span id="gameTitle">棋譜ビュー</span><button class="ghost" id="flipBtn">反転</button></div>
        <div class="board-wrap">
          <div id="board" class="board"></div>
          <div class="controls">
            <button class="ghost" id="firstBtn">|&lt;</button>
            <button class="ghost" id="prevBtn">&lt;</button>
            <button class="ghost" id="nextBtn">&gt;</button>
            <button class="ghost" id="lastBtn">&gt;|</button>
            <button class="ghost" id="copyPgnBtn">PGNコピー</button>
          </div>
        </div>
        <div id="moves" class="moves"></div>
      </div>
      <div class="analysis-panel">
        <div class="section-title"><span>解析</span><span id="analysisStatus" class="meta">未解析</span></div>
        <div class="details">
          <div class="evaltext" id="evalText">棋譜を開くと、ここに解析情報が表示されます。</div>
          <div class="evalbar"><div id="evalWhite" class="evalwhite" style="width:50%"></div></div>
          <div id="bestLine" class="meta"></div>
          <table class="table" id="analysisTable"><thead><tr><th>手</th><th>判定</th><th>損失</th><th>最善手</th></tr></thead><tbody></tbody></table>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/cjs/chess.js"></script>
  <script>
  const $ = s => document.querySelector(s);
  const state = {
    apiBase: localStorage.getItem('ychess.apiBase') || 'http://localhost:3000',
    username: '', offsets: { chesscom: 0, lichess: 0 }, games: { chesscom: [], lichess: [] },
    jobs: JSON.parse(localStorage.getItem('ychess.jobs') || '{}'),
    current: null, chess: null, history: [], ply: 0, flipped: false, analysis: null
  };
  const pieces = { p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚', P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔' };

  $('#apiBase').value = state.apiBase;
  $('#saveApi').onclick = () => { state.apiBase = $('#apiBase').value.trim().replace(/\/$/,''); localStorage.setItem('ychess.apiBase', state.apiBase); toast('API URLを保存しました'); };
  $('#searchForm').onsubmit = e => { e.preventDefault(); searchAll(); };
  $('#moreChesscom').onclick = () => loadSite('chesscom', false);
  $('#moreLichess').onclick = () => loadSite('lichess', false);
  $('#flipBtn').onclick = () => { state.flipped = !state.flipped; renderBoard(); };
  $('#firstBtn').onclick = () => goPly(0);
  $('#prevBtn').onclick = () => goPly(state.ply - 1);
  $('#nextBtn').onclick = () => goPly(state.ply + 1);
  $('#lastBtn').onclick = () => goPly(state.history.length);
  $('#copyPgnBtn').onclick = async () => { if(state.current?.pgn){ await navigator.clipboard.writeText(state.current.pgn); toast('PGNをコピーしました'); } };

  function api(path){ return `${state.apiBase}${path}`; }
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(ms){ if(!ms) return ''; const d=new Date(ms); return d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}); }
  function toast(msg){ const el=document.createElement('div'); el.textContent=msg; $('#toast').appendChild(el); setTimeout(()=>el.remove(),4200); if(Notification.permission==='granted') new Notification('Yellow Chess Reviewer',{body:msg}); }
  async function requestNotify(){ if('Notification' in window && Notification.permission==='default') { try{ await Notification.requestPermission(); }catch{} } }

  async function searchAll(){
    requestNotify();
    state.username = $('#username').value.trim();
    if(!state.username) return toast('ユーザー名を入力してください');
    state.offsets = { chesscom:0, lichess:0 }; state.games = { chesscom:[], lichess:[] };
    renderList('chesscom'); renderList('lichess');
    await Promise.allSettled([loadSite('chesscom', true), loadSite('lichess', true)]);
  }
  async function loadSite(site, reset){
    const status = $(`#${site}Status`); status.textContent = '取得中';
    const offset = reset ? 0 : state.offsets[site];
    try{
      const res = await fetch(api(`/api/games/${site}/${encodeURIComponent(state.username)}?offset=${offset}&limit=10`));
      const data = await res.json(); if(!res.ok) throw new Error(data.error || '取得失敗');
      if(reset) state.games[site] = [];
      state.games[site].push(...(data.games || [])); state.offsets[site] = state.games[site].length;
      status.textContent = `${state.games[site].length}件`;
      $(`#more${site[0].toUpperCase()+site.slice(1)}`).classList.toggle('hidden', !data.hasMore);
      renderList(site);
    }catch(e){ status.textContent = '失敗'; $(`#${site}List`).innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  function renderList(site){
    const list = $(`#${site}List`); const games = state.games[site] || [];
    if(!games.length){ list.innerHTML = `<div class="empty">${state.username ? '棋譜なし / 取得待ち' : 'ユーザー名を検索してください'}</div>`; return; }
    list.innerHTML = games.map(g => gameCardHtml(g)).join('');
    list.querySelectorAll('.game-card').forEach(card => {
      const id = card.dataset.id; const game = games.find(x => x.id === id);
      card.onclick = () => openGame(game);
      const btn = card.querySelector('.analyze');
      btn.onclick = ev => { ev.stopPropagation(); startAnalyze(game, btn); };
      const view = card.querySelector('.view-analysis');
      if(view) view.onclick = ev => { ev.stopPropagation(); showSavedAnalysis(game); };
    });
  }
  function gameCardHtml(g){
    const job = state.jobs[g.id] || {}; const done = job.status === 'done';
    const percent = job.status === 'running' || job.status === 'queued' ? (job.progress || 0) + '%' : '解析 0%';
    const analyzeClass = job.status === 'failed' ? 'fail' : done ? 'done' : 'analyze';
    const analyzeText = done ? '解析済みを見る' : (job.status === 'queued' ? '待機中' : percent);
    return `<article class="game-card" data-id="${escapeHtml(g.id)}" title="クリックで振り返り">
      <div class="game-main"><div><div class="players">${escapeHtml(g.white)} <span class="meta">vs</span> ${escapeHtml(g.black)}</div><div class="meta"><span>${escapeHtml(g.sourceLabel)}</span><span>${escapeHtml(g.result)}</span><span>${escapeHtml(g.timeControl || g.timeClass)}</span><span>${fmtDate(g.endTime)}</span></div></div></div>
      <div class="actions"><button class="tiny ${analyzeClass} analyze">${escapeHtml(analyzeText)}</button>${done ? `<button class="tiny done view-analysis">解析表示</button>` : ''}</div>
    </article>`;
  }
  function openGame(game){
    state.current = game; state.analysis = null; $('#analysisStatus').textContent = '未解析'; $('#evalText').textContent = '通常振り返りモード'; $('#bestLine').textContent=''; $('#analysisTable tbody').innerHTML=''; $('#evalWhite').style.width='50%';
    $('#gameTitle').textContent = `${game.white} vs ${game.black}`;
    loadPgnToBoard(game.pgn);
    const job = state.jobs[game.id]; if(job?.status === 'done' && job.result) showAnalysis(job.result);
  }
  function loadPgnToBoard(pgn){
    const Chess = window.Chess || window.chess?.Chess;
    state.chess = new Chess();
    try { state.chess.loadPgn(pgn, { strict:false }); } catch(e){ try{ state.chess.load_pgn(pgn); }catch{} }
    state.history = state.chess.history({ verbose:true });
    state.ply = 0; renderMoves(); renderBoard();
  }
  function positionAtPly(ply){
    const Chess = window.Chess || window.chess?.Chess; const c = new Chess();
    for(let i=0;i<Math.min(ply,state.history.length);i++) c.move(state.history[i].san);
    return c;
  }
  function goPly(p){ state.ply = Math.max(0, Math.min(state.history.length, p)); renderBoard(); renderMoves(); renderEvalForPly(); }
  function renderBoard(){
    const c = positionAtPly(state.ply); const board = c.board(); const files = ['a','b','c','d','e','f','g','h'];
    const ranks = state.flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    const fileOrder = state.flipped ? [...files].reverse() : files;
    const last = state.ply>0 ? state.history[state.ply-1] : null;
    let html='';
    for(const r of ranks){ for(const f of fileOrder){
      const row = 8-r, col = files.indexOf(f); const sqName = f+r; const p = board[row][col];
      const dark = (row+col)%2===1; const isLast = last && (last.from===sqName || last.to===sqName);
      const coord = (f===fileOrder[0] ? r : '') + (r===ranks[ranks.length-1] ? f : '');
      html += `<div class="sq ${dark?'dark':'light'} ${isLast?'last':''}">${p?pieces[p.color==='w'?p.type.toUpperCase():p.type]:''}<span class="coord">${coord}</span></div>`;
    }}
    $('#board').innerHTML = html;
  }
  function renderMoves(){
    let html='';
    state.history.forEach((m,i)=>{ if(i%2===0) html += `<span class="move-pill">${Math.floor(i/2)+1}.</span>`; html += `<button class="move-pill ${state.ply===i+1?'active':''}" data-ply="${i+1}">${escapeHtml(m.san)}</button>`; });
    $('#moves').innerHTML = html || '<span class="meta">棋譜未選択</span>';
    $('#moves').querySelectorAll('[data-ply]').forEach(b => b.onclick = () => goPly(Number(b.dataset.ply)));
  }
  async function startAnalyze(game, btn){
    if(state.jobs[game.id]?.status === 'running' || state.jobs[game.id]?.status === 'queued') return;
    btn.textContent = '0%';
    try{
      const res = await fetch(api('/api/analyze'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ gameId:game.id, pgn:game.pgn, movetime:300, deepTime:1200 }) });
      const data = await res.json(); if(!res.ok) throw new Error(data.error || '解析開始失敗');
      if(data.status === 'done') { state.jobs[game.id] = { status:'done', progress:100, result:data.result, cacheKey:data.cacheKey }; saveJobs(); toast('解析済みデータを表示できます'); renderAllLists(); return; }
      state.jobs[game.id] = { jobId:data.jobId, cacheKey:data.cacheKey, status:data.status, progress:data.progress || 0 };
      saveJobs(); renderAllLists(); pollJob(game.id);
    }catch(e){ toast(e.message); }
  }
  function pollJob(gameId){
    const job = state.jobs[gameId]; if(!job?.jobId) return;
    const timer = setInterval(async()=>{
      try{
        const res = await fetch(api(`/api/jobs/${job.jobId}`)); const data = await res.json(); if(!res.ok) throw new Error(data.error || 'job失敗');
        state.jobs[gameId] = { ...state.jobs[gameId], status:data.status, progress:data.progress||0, result:data.result, error:data.error, cacheKey:data.cacheKey };
        saveJobs(); renderAllLists(); if(state.current?.id===gameId) $('#analysisStatus').textContent = data.stage || data.status;
        if(data.status === 'done'){ clearInterval(timer); toast('解析が完了しました'); if(state.current?.id===gameId) showAnalysis(data.result); }
        if(data.status === 'failed'){ clearInterval(timer); toast('解析に失敗しました: '+(data.error||'')); }
      }catch(e){ clearInterval(timer); toast(e.message); }
    }, 1400);
  }
  function showSavedAnalysis(game){ openGame(game); const job = state.jobs[game.id]; if(job?.result) showAnalysis(job.result); else toast('解析結果がまだありません'); }
  function showAnalysis(result){ state.analysis = result; $('#analysisStatus').textContent = '解析済み'; renderEvalForPly(); renderAnalysisTable(); }
  function renderEvalForPly(){
    const e = state.analysis?.evals?.[state.ply];
    if(!e) return;
    const cp = Math.max(-800, Math.min(800, e.scoreCp || 0)); const whitePct = 50 + cp / 16;
    $('#evalWhite').style.width = Math.max(5, Math.min(95, whitePct)) + '%';
    $('#evalText').textContent = `評価値: ${e.scoreCp>0?'+':''}${(e.scoreCp/100).toFixed(2)} / depth ${e.depth || '-'}`;
    $('#bestLine').textContent = `最善手: ${e.bestmove || '-'}　PV: ${(e.pv||[]).join(' ')}`;
  }
  function renderAnalysisTable(){
    const rows = (state.analysis?.moves || []).map(r => `<tr><td>${r.index}. ${escapeHtml(r.san)}</td><td><span class="badge ${escapeHtml(r.label)}">${escapeHtml(r.label)}</span></td><td>${r.cpLoss}</td><td>${escapeHtml(r.bestmove || '')}</td></tr>`).join('');
    $('#analysisTable tbody').innerHTML = rows;
  }
  function saveJobs(){ localStorage.setItem('ychess.jobs', JSON.stringify(state.jobs)); }
  function renderAllLists(){ renderList('chesscom'); renderList('lichess'); }
  function boot(){ renderBoard(); Object.keys(state.jobs).forEach(id => { if(['queued','running'].includes(state.jobs[id].status)) pollJob(id); }); }
  boot();
  </script>
</body>
</html>
