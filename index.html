<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess.com 棋譜ビューア</title>
<style>
:root{--brand:#FFD54A;--brand2:#FFE99A;--ink:#3f3f3f;--muted:#77705d;--line:#ded2a9;--bg:#fbf6df;--panel:#fffdf6;--soft:#f5edcd;--win:#28784c;--loss:#9d4040;--draw:#665932;--boardSize:clamp(318px,56vh,552px);--pieceSize:calc(var(--boardSize)*.105);--sqLight:#f2d9a6;--sqDark:#b98754}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff9df,#f6edca);overflow:auto}button,input,textarea,select{font:inherit;color:inherit}button{border:0;border-radius:12px;background:var(--brand);padding:9px 12px;font-weight:850;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#eee4bf}.danger{background:#f2c2b8}.mini{padding:6px 9px;border-radius:10px;font-size:12px}.selectMini{border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px 7px;font-size:12px}.app{min-height:100vh;height:100vh;display:grid;grid-template-columns:minmax(300px,392px) 1fr;gap:10px;padding:10px}.pane{background:rgba(255,253,246,.94);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(80,70,30,.08);min-height:0;overflow:hidden}.left{display:grid;grid-template-rows:auto auto 1fr auto}.top,.gameHeader{background:linear-gradient(180deg,#fff5b8,#fffdf6);border-bottom:1px solid var(--line);padding:12px}.title{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:950}.mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.search input{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.status{padding:8px 12px;min-height:32px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}.status.err{color:#a33}.list{min-height:0;overflow-y:auto;padding:10px}.card{width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;background:#fffdf8;margin-bottom:9px;padding:10px;display:grid;gap:7px;transition:.12s}.card:hover{transform:translateY(-1px);background:#fff8dc}.card.active{border:2px solid var(--brand);background:#fff2bc}.cardHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.players{font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;border:1px solid transparent;white-space:nowrap}.badge:before{content:"●"}.badge.win{background:#e6f4ec;border-color:#bfe2ce;color:var(--win)}.badge.loss{background:#f7e6e2;border-color:#e8c0b8;color:var(--loss)}.badge.draw{background:#f0ead6;border-color:#dbcfaa;color:var(--draw)}.meta{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;color:#655f4d}.meta span{background:#f7f0d8;border:1px solid #eee3bf;border-radius:999px;padding:2px 7px}.loadMore{border-top:1px solid var(--line);padding:10px}.loadMore button{width:100%}.right{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}.gameHeader{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.gameTitle{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gameSub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.viewer{min-height:0;padding:10px;display:grid;grid-template-columns:minmax(310px,58vh) minmax(270px,1fr);gap:10px;align-items:start;overflow:auto}.boardBox{display:grid;gap:8px;justify-items:center}.board{width:var(--boardSize);height:var(--boardSize);max-width:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:2px solid #9a764a;border-radius:14px;overflow:hidden;box-shadow:0 8px 18px rgba(75,55,25,.13)}.sq{position:relative;display:grid;place-items:center;width:100%;height:100%;font-size:var(--pieceSize);line-height:1;overflow:hidden;user-select:none}.light{background:var(--sqLight)}.dark{background:var(--sqDark)}.sq.last:after{content:"";position:absolute;inset:0;background:rgba(255,221,45,.48)}.sq.check:before{content:"";position:absolute;inset:12%;border-radius:50%;background:rgba(220,60,60,.35)}.sq.bestFrom:after{content:"";position:absolute;inset:18%;border-radius:50%;background:rgba(70,190,80,.38);z-index:0}.sq.bestTo:before{content:"";position:absolute;inset:20%;border:3px solid rgba(45,150,45,.65);border-radius:6px;z-index:0}.piece{position:relative;z-index:1}.piece.white{color:#fffdf5;text-shadow:0 1px 2px rgba(0,0,0,.75)}.piece.black{color:#363636;text-shadow:0 1px 2px rgba(255,255,255,.35)}.coord{position:absolute;font-size:10px;font-weight:900;opacity:.68;z-index:2}.file{right:4px;bottom:2px}.rank{left:4px;top:2px}.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.side{min-height:0;display:grid;grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto;gap:8px}.moveInfo,.panel{border:1px solid var(--line);background:#fff9dc;border-radius:14px;padding:8px 10px}.moveInfo{display:flex;justify-content:space-between;gap:8px;font-size:13px}.pill{font-size:12px;background:#eee4bf;border-radius:999px;padding:4px 8px}.errLine{font-size:12px;min-height:16px;color:#9b3a30}.detailsErr summary{cursor:pointer;color:#8f6730}.detailsErr pre{white-space:pre-wrap;max-height:80px;overflow:auto;background:#fff7df;border:1px solid #eee3bf;border-radius:10px;padding:6px}.analysisTop,.cacheHead,.queueHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.analysisStatus{font-size:12px;color:var(--muted)}.sourceDot{display:inline-flex;align-items:center;gap:5px}.sourceDot:before{content:"";width:8px;height:8px;border-radius:50%;background:#b7a56c}.sourceDot.ok:before{background:#2f8f5b}.sourceDot.warn:before{background:#b87528}.sourceDot.err:before{background:#b54b4b}.evalWrap{display:grid;grid-template-columns:16px 1fr;gap:8px;margin-top:7px}.evalBar{height:94px;border-radius:10px;overflow:hidden;border:1px solid #cdbf93;background:#404040;display:flex;flex-direction:column-reverse}.evalBar.flipped{flex-direction:column}.evalWhite{background:#fffef5;width:100%;height:50%;transition:height .18s}.analysisGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cell{background:#fffdf8;border:1px solid #eee3bf;border-radius:10px;padding:6px;min-width:0;font-size:12px}.cell b{display:block;font-size:11px;color:#7a704f}.sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}.quality{font-weight:950}.quality.good{color:#2f8f5b}.quality.inaccuracy{color:#9a7a20}.quality.mistake{color:#b87528}.quality.blunder{color:#b54b4b}.queueList,.cacheList{display:grid;gap:6px;max-height:105px;overflow-y:auto}.queueItem,.cacheItem{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;border:1px solid #eee3bf;background:#fffdf8;border-radius:11px;padding:7px}.cacheItem.current{border-color:var(--brand);background:#fff2bc}.cacheTitle,.queueTitle{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cacheMeta{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.cacheEmpty{background:#f7f0d8;border-radius:10px;padding:8px;text-align:center;color:var(--muted);font-size:12px}.storageLine{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin:6px 0}.moves{min-height:0;overflow:auto;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:8px;display:flex;align-content:flex-start;gap:4px 6px;flex-wrap:wrap}.moveNo{font-size:12px;color:#888;padding:4px 2px}.moveBtn{background:#f2ecd5;border:1px solid transparent;box-shadow:none;font-weight:850;border-radius:8px;padding:4px 7px;font-size:13px}.moveBtn.active{background:var(--brand);border-color:#d2aa18}.moveBtn.good{border-color:#9fd1b5}.moveBtn.inaccuracy{border-color:#d6bd63}.moveBtn.mistake{border-color:#d99a59}.moveBtn.blunder{border-color:#d77d7d}.pgnBox{display:grid;gap:6px}.sectionToggle{width:100%;display:flex;justify-content:space-between;background:#eee4bf}.collapsible.closed .collapsibleBody{display:none}.pgnBox textarea{width:100%;height:70px;resize:none;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;font-size:12px}.pgnRow{display:flex;gap:6px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#777;padding:20px}.hidden{display:none!important}
@media(max-width:850px){:root{--boardSize:clamp(280px,49vh,410px);--pieceSize:calc(var(--boardSize)*.102)}.app{height:auto;grid-template-columns:1fr;grid-template-rows:minmax(250px,38vh) auto;padding:7px}.viewer{grid-template-columns:1fr minmax(220px,1fr);padding:7px}.gameHeader{grid-template-columns:1fr}.tools{justify-content:flex-start}}
@media(max-width:560px){:root{--boardSize:min(94vw,360px);--pieceSize:calc(var(--boardSize)*.102)}.app{grid-template-rows:minmax(230px,34vh) auto}.viewer{grid-template-columns:1fr;overflow:visible}.side{grid-template-rows:auto auto auto auto auto 110px auto}.analysisGrid{grid-template-columns:1fr}.cacheList,.queueList{max-height:82px}.coord{font-size:9px}.controls button{padding:7px 9px}.pgnBox:not(.closed) textarea{height:86px}}
</style>
</head>
<body>
<div class="app">
<section class="pane left"><div class="top"><div class="title"><span class="mark">♞</span><span>Chess.com 棋譜ビューア</span></div><div class="search"><input id="userInput" placeholder="Chess.com username" autocomplete="off"><button id="searchBtn">検索</button></div></div><div id="status" class="status">ユーザー名を入力してください。</div><div id="gameList" class="list"></div><div class="loadMore"><button id="moreBtn" disabled>さらに読み込み</button></div></section>
<section class="pane right"><div class="gameHeader"><div><div id="gameTitle" class="gameTitle">棋譜未選択</div><div id="gameSub" class="gameSub">検索結果またはPGN貼り付けから読み込めます。</div></div><div class="tools"><select id="depthSelect" class="selectMini"><option value="6">depth 6</option><option value="8" selected>depth 8</option><option value="10">depth 10</option></select><button id="analyzeBtn" class="mini" disabled>解析</button><button id="stopAnalyzeBtn" class="mini danger" disabled>停止</button><button id="copyBtn" class="mini ghost" disabled>PGNコピー</button><a id="openLink" class="hidden" target="_blank" rel="noopener"><button class="mini ghost">Chess.comで開く</button></a></div></div>
<div id="viewer" class="viewer"><div id="empty" class="empty">左の棋譜カードをクリック、またはPGNを貼り付けてください。</div><div id="boardBox" class="boardBox hidden"><div id="board" class="board"></div><div class="controls"><button id="firstBtn">最初へ</button><button id="prevBtn">前へ</button><button id="nextBtn">次へ</button><button id="lastBtn">最後へ</button><button id="flipBtn" class="ghost">反転</button></div></div>
<div class="side"><div class="moveInfo"><span id="plyInfo">0 / 0</span><span id="turnInfo" class="pill">開始局面</span></div><div id="errLine" class="errLine"></div>
<div id="analysisPanel" class="panel hidden"><div class="analysisTop"><b>解析</b><span id="engineSource" class="analysisStatus sourceDot">未確認</span><span id="analysisStatus" class="analysisStatus">未解析</span></div><div class="evalWrap"><div id="evalBar" class="evalBar"><div id="evalWhite" class="evalWhite"></div></div><div class="analysisGrid"><div class="cell"><b>評価</b><span id="evalText">-</span><span id="selfEvalText" class="sub">自分目線 -</span></div><div class="cell"><b>最善手</b><span id="bestText">-</span></div><div class="cell"><b>分類</b><span id="qualityText" class="quality">-</span></div><div class="cell"><b>根拠</b><span id="simpleText">-</span></div></div></div></div>
<div id="analysisQueuePanel" class="panel"><div class="queueHead"><b>解析キュー</b><span id="queueCount" class="analysisStatus">0件</span></div><div id="analysisQueueList" class="queueList"><div class="cacheEmpty">待機中の解析はありません。</div></div></div>
<div id="analysisCachePanel" class="panel"><div class="cacheHead"><b>解析済み一覧</b><button id="clearAllAnalysisBtn" class="mini danger">全削除</button></div><div class="storageLine"><span id="storageInfo">保存容量 -</span><button id="purgeOldAnalysisBtn" class="mini ghost">古い解析を整理</button></div><div id="analysisCacheList" class="cacheList"></div></div>
<div id="moves" class="moves"></div><div id="pgnBox" class="pgnBox collapsible closed"><button id="togglePgnBtn" class="sectionToggle" type="button"><span>PGN貼り付け</span><span>開く</span></button><div class="collapsibleBody"><textarea id="pgnInput" placeholder="PGNを貼り付け"></textarea><div class="pgnRow"><button id="loadPgnBtn">PGNを読み込む</button><button id="clearPgnBtn" class="ghost">消去</button></div></div></div></div></div></section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);const U={unicode:{P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};const ANALYSIS_PREFIX='ccv_analysis_v3_';
const state={username:'',archives:[],archiveIndex:0,games:[],shown:0,selected:null,viewer:null,ply:0,flipped:false,currentPgn:'',currentUrl:'',searching:false,analysisKey:'',analysis:null,analysisQueue:[],analysisRunning:false,analysisAbort:false,activeAnalysisKey:''};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeHtml(s){return esc(s)}function norm(s){return String(s||'').trim().toLowerCase()}function setStatus(msg,err=false){$('status').textContent=msg;$('status').classList.toggle('err',err)}function classifyFetchError(e,where='取得'){const m=String(e?.message||e||'');if(m.includes('Failed to fetch')||m.includes('NetworkError'))return `${where}に失敗しました。通信・CORS・API制限の可能性があります。`;if(m.includes('404')||m.includes('ユーザー'))return 'ユーザー名が違う、または公開棋譜を取得できません。';return m||`${where}に失敗しました。`}function fmtDate(ts){if(!ts)return '-';return new Date(ts*1000).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function timeCtrl(g){return g.time_control||'-'}
function resultFor(game,user){const u=norm(user),w=game.white||{},b=game.black||{};const isW=norm(w.username)===u,isB=norm(b.username)===u;if(!isW&&!isB)return {label:'不明',cls:'draw',side:'?',raw:'unknown'};const me=isW?w:b,op=isW?b:w;const r=String(me.result||'').toLowerCase(),or=String(op.result||'').toLowerCase();const drawSet=new Set(['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient']);const lossSet=new Set(['checkmated','resigned','timeout','abandoned']);const side=isW?'白':'黒';if(r==='win')return {label:'勝ち',cls:'win',side,raw:r};if(or==='win')return {label:'負け',cls:'loss',side,raw:r||or};if(drawSet.has(r)||drawSet.has(or))return {label:'引分',cls:'draw',side,raw:r||or};if(lossSet.has(r))return {label:'負け',cls:'loss',side,raw:r};if(lossSet.has(or))return {label:'勝ち',cls:'win',side,raw:r||or};return {label:'引分',cls:'draw',side,raw:r||or||'unknown'}}function opponent(game,user){const u=norm(user);return norm(game.white?.username)===u?game.black?.username:game.white?.username}
async function searchUser(){const user=$('userInput').value.trim();if(!user)return setStatus('ユーザー名を入力してください。',true);state.username=user;state.archives=[];state.archiveIndex=0;state.games=[];state.shown=0;state.selected=null;renderList();$('moreBtn').disabled=true;setStatus('月別アーカイブを取得中…');try{const r=await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(user)}/games/archives`,{cache:'no-store'});if(!r.ok)throw new Error('ユーザーまたは公開棋譜を取得できません。');const j=await r.json();state.archives=(j.archives||[]).slice().reverse();if(!state.archives.length)return setStatus('公開対局が見つかりません。',true);await loadMore()}catch(e){setStatus(classifyFetchError(e,'検索'),true)}}
async function loadMore(){if(state.searching)return;state.searching=true;$('moreBtn').disabled=true;setStatus('棋譜を取得中…');try{while(state.games.length<state.shown+10&&state.archiveIndex<state.archives.length){const url=state.archives[state.archiveIndex++];const r=await fetch(url,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();for(const g of (j.games||[]).reverse())if(g.pgn&&!state.games.some(x=>x.url===g.url))state.games.push(g)}state.shown=Math.min(state.games.length,state.shown+10);renderList();setStatus(`${state.games.length}件取得 / ${state.shown}件表示`)}catch(e){setStatus(classifyFetchError(e,'追加取得'),true)}finally{state.searching=false;$('moreBtn').disabled=state.archiveIndex>=state.archives.length&&state.shown>=state.games.length}}
function renderList(){const box=$('gameList');box.innerHTML='';state.games.slice(0,state.shown).forEach((g,i)=>{const rf=resultFor(g,state.username);const opp=opponent(g,state.username)||'Unknown';const moves=countMoves(g.pgn);const card=document.createElement('button');card.className='card'+(state.selected===i?' active':'');card.onclick=()=>openGame(i);card.innerHTML=`<div class="cardHead"><div class="players"><span>${esc(state.username)}</span><span style="opacity:.55"> vs </span><span>${esc(opp)}</span></div><span class="badge ${rf.cls}" title="result: ${esc(rf.raw)}">${rf.label}</span></div><div class="meta"><span>${rf.side}番</span><span>${fmtDate(g.end_time||g.start_time)}</span><span>${esc(timeCtrl(g))}</span><span>${moves}手</span><span>${esc(g.variant||'chess')}</span><span>${esc(g.time_class||'-')}</span><span>${g.rated?'rated':'casual'}</span><span>${esc(rf.raw)}</span></div>`;box.appendChild(card)})}function countMoves(pgn){return tokenizeMoves(stripHeaders(pgn||'')).filter(x=>!isResult(x)).length}function openGame(i){state.selected=i;renderList();const g=state.games[i];loadViewer(g.pgn,g.url,g)}
function showErr(msg,detail=''){const el=$('errLine');if(!detail){el.textContent=msg;return}el.innerHTML=`<details class="detailsErr"><summary>${esc(msg)}</summary><pre>${esc(detail)}</pre></details>`}function shouldFlipForUser(parsed,game){const u=norm(state.username);const black=norm(game?.black?.username||parsed.headers?.Black);return !!u&&black===u}
function loadViewer(pgn,url='',game=null){$('errLine').textContent='';try{if(game&&game.variant&&game.variant!=='chess')showErr('通常チェス以外のvariantはPGN再生が不安定な場合があります: '+game.variant);const parsed=parsePGN(pgn);const v=buildViewer(parsed);state.viewer=v;state.ply=0;state.currentPgn=pgn;state.currentUrl=url||'';state.analysisKey=hashText(pgn);state.analysis=loadStoredAnalysis();state.flipped=shouldFlipForUser(parsed,game);$('analyzeBtn').disabled=false;renderViewer(parsed,game);goPly(v.moves.length);renderAnalysis();renderAnalysisCacheList();renderQueueList()}catch(e){showErr(e.message||'PGNを読み取れません。',e.stack||'')}}
function renderViewer(parsed,game){$('empty').classList.add('hidden');$('boardBox').classList.remove('hidden');$('copyBtn').disabled=false;if(state.currentUrl){$('openLink').href=state.currentUrl;$('openLink').classList.remove('hidden')}else{$('openLink').classList.add('hidden')}const h=parsed.headers;const title=(h.White||game?.white?.username||'White')+' vs '+(h.Black||game?.black?.username||'Black');$('gameTitle').textContent=title;$('gameSub').textContent=[h.Date||'',h.Event||'',game?.time_class||'',game?.rated?'rated':''].filter(Boolean).join(' ・ ')||'PGN読み込み';renderMoves()}
function renderMoves(){const box=$('moves');box.innerHTML='';if(!state.viewer)return;const a=state.analysis||loadStoredAnalysis();state.viewer.moves.forEach((m,i)=>{if(i%2===0){const no=document.createElement('span');no.className='moveNo';no.textContent=(Math.floor(i/2)+1)+'.';box.appendChild(no)}const q=(a?.stockfish?.[i+1]||a?.simple?.[i+1])?.quality||'';const b=document.createElement('button');b.className='moveBtn '+q+(state.ply===i+1?' active':'');b.textContent=m.san;b.onclick=()=>goPly(i+1);box.appendChild(b)})}function scrollActiveMove(){const m=document.querySelector('.moveBtn.active');if(m)try{m.scrollIntoView({block:'nearest',inline:'nearest'})}catch{}}
function goPly(p){if(!state.viewer)return;state.ply=Math.max(0,Math.min(p,state.viewer.positions.length-1));drawBoard();renderMoves();$('plyInfo').textContent=`${state.ply} / ${state.viewer.moves.length}`;$('turnInfo').textContent=state.ply===0?'開始局面':state.viewer.moves[state.ply-1]?.san||'';renderAnalysis();scrollActiveMove()}
function drawBoard(){const b=$('board');b.innerHTML='';if(!state.viewer)return;const pos=state.viewer.positions[state.ply];const last=state.ply?state.viewer.moves[state.ply-1]:null;const checkSq=pos.inCheckSquare();const bm=uciToMove(currentBestMove());for(let rr=0;rr<8;rr++)for(let ff=0;ff<8;ff++){const r=state.flipped?rr:7-rr,f=state.flipped?7-ff:ff,idx=r*8+f;const sq=document.createElement('div');sq.className='sq '+(((r+f)&1)?'dark':'light');if(last&&(idx===last.from||idx===last.to))sq.classList.add('last');if(bm&&idx===bm.from)sq.classList.add('bestFrom');if(bm&&idx===bm.to)sq.classList.add('bestTo');if(idx===checkSq)sq.classList.add('check');const pc=pos.board[idx];if(pc){const sp=document.createElement('span');sp.className='piece '+(pc===pc.toUpperCase()?'white':'black');sp.textContent=U.unicode[pc];sq.appendChild(sp)}if((state.flipped?rr===0:rr===7)){const c=document.createElement('span');c.className='coord file';c.textContent='abcdefgh'[f];sq.appendChild(c)}if((state.flipped?ff===7:ff===0)){const c=document.createElement('span');c.className='coord rank';c.textContent=String(r+1);sq.appendChild(c)}b.appendChild(sq)}}

async function processAnalysisQueue(){if(state.analysisRunning)return;state.analysisRunning=true;$('analyzeBtn').disabled=true;$('stopAnalyzeBtn').disabled=false;renderQueueList();while(state.analysisQueue.length&&!state.analysisAbort){const job=state.analysisQueue.shift();state.activeAnalysisKey=job.key;renderQueueList();await runStockfishJob(job)}state.activeAnalysisKey='';state.analysisRunning=false;state.analysisAbort=false;$('analyzeBtn').disabled=!state.viewer;$('stopAnalyzeBtn').disabled=true;renderQueueList()}function stopAnalysis(){state.analysisAbort=true;state.analysisQueue=[];$('analysisStatus').textContent='停止中…';renderQueueList()}
function makeEngine(){return new Promise((resolve,reject)=>{try{const code="self.Module={};importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');";const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));const w=new Worker(url);let ready=false,done=false;const fail=msg=>{if(done)return;done=true;try{w.terminate()}catch{}URL.revokeObjectURL(url);reject(new Error(msg))};const timer=setTimeout(()=>{if(!ready)fail('Stockfishを読み込めません。GitHub Pagesなど https 上で開いてください。')},10000);w.onmessage=e=>{const msg=String(e.data||'');if(msg.includes('uciok')){ready=true;done=true;clearTimeout(timer);URL.revokeObjectURL(url);resolve(w)}};w.onerror=()=>fail('Stockfish起動エラー');w.postMessage('uci')}catch(e){reject(e)}})}function engineReady(w){return new Promise(res=>{const h=e=>{if(String(e.data).includes('readyok')){w.removeEventListener('message',h);res()}};w.addEventListener('message',h);w.postMessage('isready')})}function analyzeFen(w,fen,depth=8){return new Promise(res=>{let best='',cp=null,mate=null;const h=e=>{const msg=String(e.data||'');let m=msg.match(/score cp (-?\d+)/);if(m){cp=Number(m[1]);mate=null}m=msg.match(/score mate (-?\d+)/);if(m){mate=Number(m[1]);cp=mate>0?100000:-100000}m=msg.match(/^bestmove\s+(\S+)/);if(m){best=m[1];w.removeEventListener('message',h);res({best,cp,mate})}};w.addEventListener('message',h);w.postMessage('position fen '+fen);w.postMessage('go depth '+depth)})}function stockfishCpToWhite(cp,fen){if(cp==null)return cp;return /\s+b\s/.test(fen)?-cp:cp}
async function runStockfishJob(job){let obj=null,w=null;try{obj=JSON.parse(localStorage.getItem(ANALYSIS_PREFIX+job.key)||'null')||{version:3,key:job.key,created:Date.now(),meta:job.meta,simple:{},stockfish:{},status:{}};obj.meta=obj.meta||job.meta;obj.created=obj.created||Date.now();obj.status.stockfishProgress='準備中';localStorage.setItem(ANALYSIS_PREFIX+job.key,JSON.stringify(obj));renderAnalysisCacheList();if(state.analysisKey===job.key){state.analysis=obj;renderAnalysis()}w=await makeEngine();await engineReady(w);let prevCp=null;for(let i=0;i<job.positions.length&&!state.analysisAbort;i++){obj.status.stockfishProgress=`${i} / ${job.positions.length-1}`;localStorage.setItem(ANALYSIS_PREFIX+job.key,JSON.stringify(obj));if(i%4===0)renderAnalysisCacheList();if(state.analysisKey===job.key){state.analysis=obj;renderAnalysis()}const r=await analyzeFen(w,job.positions[i],job.depth||8),cp=stockfishCpToWhite(r.cp,job.positions[i]);let q='good';if(i>0&&prevCp!=null&&cp!=null){const mover=i%2===1?'w':'b',drop=mover==='w'?prevCp-cp:cp-prevCp;q=classifyDrop(drop)}obj.stockfish[i]={type:'stockfish',cp,mate:r.mate,best:r.best,quality:q,note:'SF depth '+(job.depth||8)};prevCp=cp}try{w.terminate()}catch{}if(!state.analysisAbort){obj.status.stockfishDone=true;obj.status.stockfishProgress='完了'}else obj.status.stockfishProgress='停止';localStorage.setItem(ANALYSIS_PREFIX+job.key,JSON.stringify(obj));if(state.analysisKey===job.key){state.analysis=obj;renderAnalysis();renderMoves();drawBoard()}renderAnalysisCacheList()}catch(e){try{if(w)w.terminate()}catch{}if(obj){obj.status.stockfishProgress='エラー';obj.status.stockfishError=e.message||'Stockfish解析エラー';try{localStorage.setItem(ANALYSIS_PREFIX+job.key,JSON.stringify(obj))}catch{}}if(state.analysisKey===job.key){$('analysisStatus').textContent=e.message||'Stockfish解析エラー';state.analysis=obj;renderAnalysis()}renderAnalysisCacheList()}}
$('searchBtn').onclick=searchUser;$('moreBtn').onclick=loadMore;$('userInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchUser()});$('firstBtn').onclick=()=>goPly(0);$('prevBtn').onclick=()=>goPly(state.ply-1);$('nextBtn').onclick=()=>goPly(state.ply+1);$('lastBtn').onclick=()=>state.viewer&&goPly(state.viewer.moves.length);$('flipBtn').onclick=()=>{state.flipped=!state.flipped;drawBoard();renderAnalysis()};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(state.currentPgn);showErr('PGNをコピーしました。');setTimeout(()=>showErr(''),1200)}catch{showErr('コピーできませんでした。')}};$('loadPgnBtn').onclick=()=>loadViewer($('pgnInput').value,'',null);$('clearPgnBtn').onclick=()=>{$('pgnInput').value=''};$('togglePgnBtn').onclick=()=>{const box=$('pgnBox');box.classList.toggle('closed');$('togglePgnBtn').lastElementChild.textContent=box.classList.contains('closed')?'開く':'閉じる'};$('analyzeBtn').onclick=requestAnalyze;$('stopAnalyzeBtn').onclick=stopAnalysis;$('clearAllAnalysisBtn').onclick=clearAllAnalyses;$('purgeOldAnalysisBtn').onclick=()=>purgeOldAnalyses(30);
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(!state.viewer)return;if(e.key==='ArrowLeft'){e.preventDefault();goPly(state.ply-1)}if(e.key==='ArrowRight'){e.preventDefault();goPly(state.ply+1)}if(e.key==='Home'){e.preventDefault();goPly(0)}if(e.key==='End'){e.preventDefault();goPly(state.viewer.moves.length)}if(e.key.toLowerCase()==='f'){state.flipped=!state.flipped;drawBoard();renderAnalysis()}});renderAnalysisCacheList();renderQueueList();drawBoard();
