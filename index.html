<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Chess.com 棋譜ビューア</title>
<style>
:root{
  --brand:#FFD54A; --brand2:#FFE58A; --ink:#3f3f3f; --muted:#777; --line:#ded7bc;
  --bg:#fbf7e8; --panel:#fffdf6; --soft:#f4eed7; --win:#2f8f5b; --loss:#b54b4b; --draw:#7a6b45;
  --sqLight:#f2d9a6; --sqDark:#b98754; --last:#f7e36b; --check:#f0a6a6;
}
*{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff9df,#f7f0d3)}
button,input,textarea{font:inherit;color:inherit} button{cursor:pointer;border:0;border-radius:12px;background:var(--brand);padding:9px 12px;font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.08)}
button:hover{filter:brightness(.98)} button:disabled{opacity:.45;cursor:not-allowed}.ghost{background:#efe7c7}.danger{background:#f4c8bd}.mini{padding:6px 9px;border-radius:10px;font-size:12px}.app{height:100vh;display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:10px;padding:10px;overflow:hidden}.pane{background:rgba(255,253,246,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(80,70,30,.08);min-height:0;overflow:hidden}.left{display:grid;grid-template-rows:auto auto 1fr auto}.top{padding:12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff9d6,#fffdf6)}.title{font-weight:900;letter-spacing:.02em;font-size:18px;display:flex;gap:8px;align-items:center}.title .mark{width:24px;height:24px;border-radius:7px;background:var(--brand);display:grid;place-items:center}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.status{min-height:28px;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}.status.err{color:#a33}.list{overflow-y:auto;min-height:0;padding:10px}.card{width:100%;text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:15px;margin-bottom:9px;padding:10px;display:grid;gap:6px;transition:.12s transform,.12s border,.12s background}.card:hover{transform:translateY(-1px);background:#fff9e5}.card.active{border:2px solid var(--brand);background:#fff5c9}.cardHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.players{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:12px;border-radius:999px;padding:3px 8px;font-weight:800}.badge.win{background:#dcefe4;color:var(--win)}.badge.loss{background:#f2dddd;color:var(--loss)}.badge.draw{background:#eee7cf;color:var(--draw)}.meta{display:flex;flex-wrap:wrap;gap:5px 8px;font-size:12px;color:#68604a}.loadMore{padding:10px;border-top:1px solid var(--line);background:#fffdf6}.loadMore button{width:100%}.right{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}.gameHeader{padding:10px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff9d6,#fffdf6);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.gameTitle{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gameSub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.viewer{min-height:0;padding:10px;display:grid;grid-template-columns:minmax(310px,58vh) minmax(260px,1fr);gap:10px;align-items:start;overflow:hidden}.boardBox{display:grid;gap:8px;justify-items:center;min-width:0}.board{width:min(58vh,100%,560px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:2px solid #9a764a;border-radius:12px;overflow:hidden;background:#c99;box-shadow:0 8px 18px rgba(75,55,25,.13)}.sq{position:relative;display:grid;place-items:center;font-size:clamp(28px,5.7vh,54px);line-height:1;user-select:none}.light{background:var(--sqLight)}.dark{background:var(--sqDark)}.sq.last::after{content:"";position:absolute;inset:0;background:rgba(255,221,45,.48)}.sq.check::before{content:"";position:absolute;inset:12%;border-radius:50%;background:rgba(220,60,60,.38)}.piece{position:relative;z-index:1;text-shadow:0 1px 2px rgba(255,255,255,.7),0 -1px 1px rgba(0,0,0,.2)}.piece.black{color:#343434;text-shadow:0 1px 2px rgba(255,255,255,.35)}.piece.white{color:#fdfdfd;text-shadow:0 1px 2px rgba(0,0,0,.75)}.coord{position:absolute;font-size:10px;font-weight:800;opacity:.68;z-index:2}.file{right:4px;bottom:2px}.rank{left:4px;top:2px}.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.side{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px}.moveInfo{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff9dc;border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13px}.moves{min-height:0;overflow:hidden;border:1px solid var(--line);background:#fffdf8;border-radius:14px;padding:8px;display:flex;align-content:flex-start;gap:4px 6px;flex-wrap:wrap}.moveNo{font-size:12px;color:#888;padding:4px 2px}.moveBtn{background:#f2ecd5;border:1px solid transparent;box-shadow:none;font-weight:700;border-radius:8px;padding:4px 7px;font-size:13px}.moveBtn.active{background:var(--brand);border-color:#d9af20}.pgnBox{display:grid;gap:6px}.pgnRow{display:flex;gap:6px}.pgnBox textarea{width:100%;height:58px;resize:none;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;font-size:12px}.empty{height:100%;display:grid;place-items:center;color:#777;text-align:center;padding:20px}.errLine{color:#a33;font-size:12px;min-height:16px}.pill{font-size:12px;background:#efe7c7;border-radius:999px;padding:4px 8px}.hidden{display:none!important}
@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:38vh 1fr;padding:7px;gap:7px}.viewer{grid-template-columns:1fr minmax(210px,1fr);gap:7px;padding:7px}.board{width:min(49vh,100%,410px)}.sq{font-size:clamp(22px,4.7vh,38px)}.title{font-size:15px}.gameHeader{grid-template-columns:1fr}.tools{justify-content:flex-start}.pgnBox textarea{height:48px}.moves{font-size:12px}.moveBtn{font-size:12px;padding:3px 6px}}
@media(max-width:560px){.app{grid-template-rows:34vh 1fr}.viewer{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:hidden}.board{width:min(48vh,94vw,360px)}.side{grid-template-rows:auto auto 90px auto}.controls button{padding:7px 9px}.coord{font-size:9px}}
</style>
</head>
<body>
<div class="app">
  <section class="pane left">
    <div class="top">
      <div class="title"><span class="mark">♞</span><span>Chess.com 棋譜ビューア</span></div>
      <div class="search"><input id="userInput" placeholder="Chess.com username" autocomplete="off"><button id="searchBtn">検索</button></div>
    </div>
    <div id="status" class="status">ユーザー名を入力してください。</div>
    <div id="gameList" class="list"></div>
    <div class="loadMore"><button id="moreBtn" disabled>さらに読み込み</button></div>
  </section>
  <section class="pane right">
    <div class="gameHeader">
      <div><div id="gameTitle" class="gameTitle">棋譜未選択</div><div id="gameSub" class="gameSub">検索結果またはPGN貼り付けから読み込めます。</div></div>
      <div class="tools"><button id="copyBtn" class="mini ghost" disabled>PGNコピー</button><a id="openLink" class="hidden" target="_blank" rel="noopener"><button class="mini ghost">Chess.comで開く</button></a></div>
    </div>
    <div id="viewer" class="viewer">
      <div id="empty" class="empty">左の棋譜カードをクリック、または右下にPGNを貼り付けてください。</div>
      <div id="boardBox" class="boardBox hidden">
        <div id="board" class="board" aria-label="chess board"></div>
        <div class="controls">
          <button id="firstBtn">最初へ</button><button id="prevBtn">前へ</button><button id="nextBtn">次へ</button><button id="lastBtn">最後へ</button><button id="flipBtn" class="ghost">反転</button>
        </div>
      </div>
      <div class="side">
        <div class="moveInfo"><span id="plyInfo">0 / 0</span><span id="turnInfo" class="pill">開始局面</span></div>
        <div id="errLine" class="errLine"></div>
        <div id="moves" class="moves"></div>
        <div class="pgnBox"><textarea id="pgnInput" placeholder="PGNを貼り付け"></textarea><div class="pgnRow"><button id="loadPgnBtn">PGNを読み込む</button><button id="clearPgnBtn" class="ghost">消去</button></div></div>
      </div>
    </div>
  </section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const U={light:'PNBRQK',dark:'pnbrqk',unicode:{P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};
const state={username:'',archives:[],archiveIndex:0,games:[],shown:0,selected:null,viewer:null,ply:0,flipped:false,currentPgn:'',currentUrl:'',searching:false};
function setStatus(msg,err=false){$('status').textContent=msg;$('status').classList.toggle('err',err)}
function fmtDate(ts){if(!ts)return '-';return new Date(ts*1000).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function timeCtrl(g){return g.time_control||'-'}
function norm(s){return String(s||'').trim().toLowerCase()}
function resultFor(game,user){const u=norm(user),w=game.white||{},b=game.black||{};const isW=norm(w.username)===u,isB=norm(b.username)===u;if(!isW&&!isB)return {label:'不明',cls:'draw',side:'?'};const me=isW?w:b,op=isW?b:w;const r=String(me.result||'').toLowerCase(),or=String(op.result||'').toLowerCase();const drawSet=new Set(['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient']);const lossSet=new Set(['checkmated','resigned','timeout','abandoned']);if(r==='win')return {label:'勝ち',cls:'win',side:isW?'白':'黒'};if(or==='win')return {label:'負け',cls:'loss',side:isW?'白':'黒'};if(drawSet.has(r)||drawSet.has(or))return {label:'引分',cls:'draw',side:isW?'白':'黒'};if(lossSet.has(r))return {label:'負け',cls:'loss',side:isW?'白':'黒'};if(lossSet.has(or))return {label:'勝ち',cls:'win',side:isW?'白':'黒'};return {label:'引分',cls:'draw',side:isW?'白':'黒'}}
function opponent(game,user){const u=norm(user);return norm(game.white?.username)===u?game.black?.username:game.white?.username}
async function searchUser(){const user=$('userInput').value.trim();if(!user)return setStatus('ユーザー名を入力してください。',true);state.username=user;state.archives=[];state.archiveIndex=0;state.games=[];state.shown=0;state.selected=null;renderList();$('moreBtn').disabled=true;setStatus('月別アーカイブを取得中…');try{const r=await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(user)}/games/archives`,{cache:'no-store'});if(!r.ok)throw new Error('ユーザーまたは公開棋譜を取得できません。');const j=await r.json();state.archives=(j.archives||[]).slice().reverse();if(!state.archives.length){setStatus('公開対局が見つかりません。',true);return}await loadMore()}catch(e){setStatus(e.message||'取得に失敗しました。',true)}}
async function loadMore(){if(state.searching)return;state.searching=true;$('moreBtn').disabled=true;setStatus('棋譜を取得中…');try{while(state.games.length<state.shown+10 && state.archiveIndex<state.archives.length){const url=state.archives[state.archiveIndex++];const r=await fetch(url,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();for(const g of (j.games||[]).reverse()){if(!state.games.some(x=>x.url===g.url))state.games.push(g)}}state.shown=Math.min(state.games.length,state.shown+10);renderList();setStatus(`${state.games.length}件取得 / ${state.shown}件表示`);$('moreBtn').disabled=state.archiveIndex>=state.archives.length&&state.shown>=state.games.length}catch(e){setStatus('追加取得に失敗しました。',true)}finally{state.searching=false;$('moreBtn').disabled=state.archiveIndex>=state.archives.length&&state.shown>=state.games.length}}
function renderList(){const box=$('gameList');box.innerHTML='';state.games.slice(0,state.shown).forEach((g,i)=>{const rf=resultFor(g,state.username);const opp=opponent(g,state.username)||'Unknown';const me=state.username;const card=document.createElement('button');card.className='card'+(state.selected===i?' active':'');card.onclick=()=>openGame(i);const moves=countMoves(g.pgn);card.innerHTML=`<div class="cardHead"><div class="players">${esc(me)} vs ${esc(opp)}</div><span class="badge ${rf.cls}">${rf.label}</span></div><div class="meta"><span>${rf.side}番</span><span>${fmtDate(g.end_time||g.start_time)}</span><span>${esc(timeCtrl(g))}</span><span>${moves}手</span><span>${esc(g.variant||'chess')}</span><span>${esc(g.time_class||'-')}</span><span>${g.rated?'rated':'casual'}</span></div>`;box.appendChild(card)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function countMoves(pgn){const t=tokenizeMoves(stripHeaders(pgn||''));return t.filter(x=>!isResult(x)).length}
function openGame(i){state.selected=i;renderList();const g=state.games[i];loadViewer(g.pgn,g.url,g)}
function loadViewer(pgn,url='',game=null){$('errLine').textContent='';try{const parsed=parsePGN(pgn);const v=buildViewer(parsed);state.viewer=v;state.ply=0;state.currentPgn=pgn;state.currentUrl=url||'';state.flipped=false;renderViewer(parsed,game);goPly(v.moves.length)}catch(e){$('errLine').textContent=e.message||'PGNを読み取れません。'}}
function renderViewer(parsed,game){$('empty').classList.add('hidden');$('boardBox').classList.remove('hidden');$('copyBtn').disabled=false;if(state.currentUrl){$('openLink').href=state.currentUrl;$('openLink').classList.remove('hidden')}else{$('openLink').classList.add('hidden')}const h=parsed.headers;const title=(h.White||game?.white?.username||'White')+' vs '+(h.Black||game?.black?.username||'Black');$('gameTitle').textContent=title;$('gameSub').textContent=[h.Date||'',h.Event||'',game?.time_class||'',game?.rated?'rated':''].filter(Boolean).join(' ・ ')||'PGN読み込み';renderMoves()}
function renderMoves(){const box=$('moves');box.innerHTML='';if(!state.viewer)return;state.viewer.moves.forEach((m,i)=>{if(i%2===0){const no=document.createElement('span');no.className='moveNo';no.textContent=(Math.floor(i/2)+1)+'.';box.appendChild(no)}const b=document.createElement('button');b.className='moveBtn'+(state.ply===i+1?' active':'');b.textContent=m.san;b.onclick=()=>goPly(i+1);box.appendChild(b)})}
function goPly(p){if(!state.viewer)return;state.ply=Math.max(0,Math.min(p,state.viewer.positions.length-1));drawBoard();renderMoves();$('plyInfo').textContent=`${state.ply} / ${state.viewer.moves.length}`;$('turnInfo').textContent=state.ply===0?'開始局面':state.viewer.moves[state.ply-1]?.san||''}
function drawBoard(){const b=$('board');b.innerHTML='';if(!state.viewer)return;const pos=state.viewer.positions[state.ply];const last=state.ply?state.viewer.moves[state.ply-1]:null;const checkSq=pos.inCheckSquare();for(let rr=0;rr<8;rr++)for(let ff=0;ff<8;ff++){const r=state.flipped?rr:7-rr, f=state.flipped?7-ff:ff;const idx=r*8+f;const sq=document.createElement('div');sq.className='sq '+(((r+f)&1)?'dark':'light');if(last&&(idx===last.from||idx===last.to))sq.classList.add('last');if(idx===checkSq)sq.classList.add('check');const pc=pos.board[idx];if(pc){const sp=document.createElement('span');sp.className='piece '+(pc===pc.toUpperCase()?'white':'black');sp.textContent=U.unicode[pc];sq.appendChild(sp)}if((state.flipped?rr===0:rr===7)){const c=document.createElement('span');c.className='coord file';c.textContent='abcdefgh'[f];sq.appendChild(c)}if((state.flipped?ff===7:ff===0)){const c=document.createElement('span');c.className='coord rank';c.textContent=String(r+1);sq.appendChild(c)}b.appendChild(sq)}}
function parsePGN(pgn){if(!pgn||!pgn.trim())throw new Error('PGNが空です。');const headers={};pgn.replace(/^\s*\[([^\s]+)\s+"([^"]*)"\]\s*$/gm,(_,k,v)=>{headers[k]=v;return''});const body=stripHeaders(pgn);const tokens=tokenizeMoves(body).filter(x=>!isResult(x)&&!/^\$\d+$/.test(x));return {headers,tokens,raw:pgn}}
function stripHeaders(pgn){return pgn.replace(/^\s*\[[^\n]*\]\s*$/gm,' ')}
function tokenizeMoves(s){s=s.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ').replace(/\([^()]*\)/g,' ');s=s.replace(/\d+\.(\.\.)?/g,' ');return s.split(/\s+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\d+\.+/,''))}
function isResult(t){return /^(1-0|0-1|1\/2-1\/2|\*)$/.test(t)}
function buildViewer(parsed){let c=new Chess();const positions=[c.clone()],moves=[];for(const san of parsed.tokens){const mv=c.moveSAN(san);moves.push({...mv,san});positions.push(c.clone())}return {positions,moves,headers:parsed.headers}}
class Chess{
 constructor(){this.board=Array(64).fill(null);this.turn='w';this.castle={K:true,Q:true,k:true,q:true};this.ep=-1;this.half=0;this.full=1;this.setup()}
 setup(){const back='RNBQKBNR';for(let f=0;f<8;f++){this.board[f]=back[f];this.board[8+f]='P';this.board[48+f]='p';this.board[56+f]=back[f].toLowerCase()}}
 clone(){const c=new Chess();c.board=this.board.slice();c.turn=this.turn;c.castle={...this.castle};c.ep=this.ep;c.half=this.half;c.full=this.full;return c}
 color(p){return !p?null:(p===p.toUpperCase()?'w':'b')}
 enemy(){return this.turn==='w'?'b':'w'}
 inb(r,f){return r>=0&&r<8&&f>=0&&f<8}
 rf(i){return [Math.floor(i/8),i%8]}
 idx(r,f){return r*8+f}
 kingSq(col=this.turn){const k=col==='w'?'K':'k';return this.board.findIndex(x=>x===k)}
 attacked(sq,by){for(const m of this.pseudo(by,true))if(m.to===sq)return true;return false}
 inCheck(col=this.turn){return this.attacked(this.kingSq(col),col==='w'?'b':'w')}
 inCheckSquare(){return this.inCheck(this.turn)?this.kingSq(this.turn):-1}
 legal(){return this.pseudo(this.turn,false).filter(m=>{const c=this.clone();c.apply(m);return !c.inCheck(this.turn)})}
 pseudo(col=this.turn,attackOnly=false){const res=[];for(let i=0;i<64;i++){const p=this.board[i];if(!p||this.color(p)!==col)continue;const type=p.toUpperCase(),[r,f]=this.rf(i),dir=col==='w'?1:-1;
  const add=(to,extra={})=>{const cap=this.board[to];if(cap&&this.color(cap)===col)return;res.push({from:i,to,piece:type,capture:!!cap,...extra})};
  if(type==='P'){
   for(const df of [-1,1]){const nr=r+dir,nf=f+df;if(this.inb(nr,nf)){const to=this.idx(nr,nf);if(this.board[to]&&this.color(this.board[to])!==col){if(nr===0||nr===7){for(const pr of ['Q','R','B','N'])res.push({from:i,to,piece:'P',capture:true,promotion:pr})}else add(to)}else if(to===this.ep)res.push({from:i,to,piece:'P',capture:true,ep:true})}}
   if(attackOnly)continue;const one=this.idx(r+dir,f);if(this.inb(r+dir,f)&&!this.board[one]){if(r+dir===0||r+dir===7){for(const pr of ['Q','R','B','N'])res.push({from:i,to:one,piece:'P',promotion:pr})}else add(one);const start=col==='w'?1:6,two=this.idx(r+2*dir,f);if(r===start&&!this.board[two])res.push({from:i,to:two,piece:'P',dbl:true})}
  } else if(type==='N'){
   for(const [dr,df] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){const nr=r+dr,nf=f+df;if(this.inb(nr,nf))add(this.idx(nr,nf))}
  } else if(type==='B'||type==='R'||type==='Q'){
   const dirs=[];if(type!=='R')dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);if(type!=='B')dirs.push([1,0],[-1,0],[0,1],[0,-1]);for(const [dr,df] of dirs){let nr=r+dr,nf=f+df;while(this.inb(nr,nf)){const to=this.idx(nr,nf),cap=this.board[to];if(!cap)add(to);else{if(this.color(cap)!==col)add(to);break}nr+=dr;nf+=df}}
  } else if(type==='K'){
   for(const dr of [-1,0,1])for(const df of [-1,0,1])if(dr||df){const nr=r+dr,nf=f+df;if(this.inb(nr,nf))add(this.idx(nr,nf))}
   if(!attackOnly&&!this.inCheck(col)){
    if(col==='w'&&r===0&&f===4){if(this.castle.K&&!this.board[5]&&!this.board[6]&&!this.attacked(5,'b')&&!this.attacked(6,'b'))res.push({from:4,to:6,piece:'K',castle:'K'});if(this.castle.Q&&!this.board[1]&&!this.board[2]&&!this.board[3]&&!this.attacked(3,'b')&&!this.attacked(2,'b'))res.push({from:4,to:2,piece:'K',castle:'Q'})}
    if(col==='b'&&r===7&&f===4){if(this.castle.k&&!this.board[61]&&!this.board[62]&&!this.attacked(61,'w')&&!this.attacked(62,'w'))res.push({from:60,to:62,piece:'K',castle:'K'});if(this.castle.q&&!this.board[57]&&!this.board[58]&&!this.board[59]&&!this.attacked(59,'w')&&!this.attacked(58,'w'))res.push({from:60,to:58,piece:'K',castle:'Q'})}
   }
  }
 }return res}
 apply(m){const p=this.board[m.from],col=this.color(p),target=this.board[m.to];this.board[m.from]=null;if(m.ep){const [r,f]=this.rf(m.to);this.board[this.idx(r+(col==='w'?-1:1),f)]=null}if(m.castle){if(m.to===6){this.board[5]='R';this.board[7]=null}else if(m.to===2){this.board[3]='R';this.board[0]=null}else if(m.to===62){this.board[61]='r';this.board[63]=null}else if(m.to===58){this.board[59]='r';this.board[56]=null}}
  this.board[m.to]=m.promotion?(col==='w'?m.promotion:m.promotion.toLowerCase()):p;
  if(p==='K'){this.castle.K=false;this.castle.Q=false} if(p==='k'){this.castle.k=false;this.castle.q=false}
  if(m.from===0||m.to===0)this.castle.Q=false;if(m.from===7||m.to===7)this.castle.K=false;if(m.from===56||m.to===56)this.castle.q=false;if(m.from===63||m.to===63)this.castle.k=false;
  this.ep=m.dbl?m.from+(col==='w'?8:-8):-1;this.turn=this.enemy();if(col==='b')this.full++;return target}
 cleanSAN(s){return s.replace(/[!?]+/g,'').replace(/[+#]+$/,'').replace(/ e\.p\.$/,'')}
 moveSAN(san){let s=this.cleanSAN(san);let promo=null;const pm=s.match(/=([QRBN])/);if(pm){promo=pm[1];s=s.replace(/=([QRBN])/,'')}let legal=this.legal();let chosen=null;if(s==='O-O'||s==='0-0')chosen=legal.find(m=>m.castle==='K');else if(s==='O-O-O'||s==='0-0-0')chosen=legal.find(m=>m.castle==='Q');else{const dest=s.match(/([a-h][1-8])$/);if(!dest)throw new Error('SAN解析エラー: '+san);const to=alg(dest[1]);let head=s.slice(0,s.length-2);const capture=head.includes('x');head=head.replace('x','');let piece='P';if(/^[KQRBN]/.test(head)){piece=head[0];head=head.slice(1)}const dis=head;legal=legal.filter(m=>m.to===to&&m.piece===piece&&(promo?m.promotion===promo:(!m.promotion||m.promotion==='Q')));if(capture)legal=legal.filter(m=>m.capture);if(dis){legal=legal.filter(m=>{const [r,f]=this.rf(m.from);return dis.split('').every(ch=>/[a-h]/.test(ch)?f==='abcdefgh'.indexOf(ch):r===Number(ch)-1)})}chosen=legal[0]}
  if(!chosen)throw new Error('合法手を特定できません: '+san);this.apply(chosen);return chosen}
}
function alg(a){return (Number(a[1])-1)*8+'abcdefgh'.indexOf(a[0])}
