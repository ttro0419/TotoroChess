<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yellow Chess Reviewer</title>
  <link rel="icon" href="icon.png">
  <script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/cjs/chess.js"></script>
  <style>
    :root{--y:#FFD54A;--ink:#333;--muted:#777;--line:#e6e0c8;--bg:#fffaf0;--card:#fffef9;--bad:#d9534f;--good:#3c8c5a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif} button,input{font:inherit}
    header{position:sticky;top:0;z-index:10;background:rgba(255,250,240,.96);border-bottom:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:190px 1fr auto auto;gap:8px;align-items:center}
    .brand{font-weight:800;letter-spacing:.2px}.api{display:flex;gap:6px;align-items:center}.api input,.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.search{display:flex;gap:6px}
    button{border:0;border-radius:12px;background:var(--y);padding:10px 12px;cursor:pointer;font-weight:700;color:#3c3210} button.secondary{background:#fff;border:1px solid var(--line);font-weight:650} button:disabled{opacity:.55;cursor:not-allowed}.status{font-size:12px;color:var(--muted)}
    main{display:grid;grid-template-columns:360px 360px 1fr;gap:12px;padding:12px}.col,.viewer{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:calc(100vh - 92px)}.col h2{font-size:16px;margin:0;padding:12px 14px;background:#fff4bf;border-bottom:1px solid var(--line)}.list{display:flex;flex-direction:column}.game{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.game:hover{background:#fff8d8}.gameTop{display:flex;justify-content:space-between;gap:10px}.players{font-weight:750}.meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:13px}.more{margin:12px}.msg{padding:12px 14px;color:var(--muted);font-size:14px}.err{color:var(--bad)}.ok{color:var(--good)}
    .viewer{padding:14px}.viewerHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:12px}.viewerTitle{font-weight:800}.boardWrap{display:flex;gap:14px;align-items:flex-start}.board{width:min(64vw,420px);height:min(64vw,420px);display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #b99825;border-radius:10px;overflow:hidden;background:#eee}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(24px,6vw,42px);position:relative}.light{background:#f3df9a}.dark{background:#b88a35}.coord{position:absolute;left:3px;bottom:2px;font-size:10px;opacity:.65}.moves{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;min-width:230px}.move{display:inline-block;margin:4px;padding:5px 7px;border-radius:8px;cursor:pointer}.move:hover,.move.active{background:#fff0a3}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.analysisBox{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;max-height:240px;overflow:auto}.bar{height:12px;border-radius:99px;background:#eee;overflow:hidden}.bar>div{height:100%;background:var(--y);width:0%}@media(max-width:1050px){main{grid-template-columns:1fr}.col,.viewer{min-height:auto}header{grid-template-columns:1fr}.boardWrap{flex-direction:column}.board{width:min(92vw,420px);height:min(92vw,420px)}}
  </style>
</head>
<body>
<header>
  <div class="brand">Yellow Chess Reviewer</div>
  <div class="api"><input id="apiUrl" placeholder="API URL 例: http://localhost:3000"><button class="secondary" id="saveApi">API保存</button><button class="secondary" id="checkApi">接続確認</button></div>
  <div class="search"><input id="username" placeholder="ユーザー名"><button id="searchBtn">検索</button></div>
  <div class="status" id="apiStatus">API未確認</div>
</header>
<main>
  <section class="col"><h2>Chess.com</h2><div id="chesscomList" class="list"><div class="msg">API接続後に検索できます。</div></div><button class="more secondary" data-site="chesscom">さらに読み込み</button></section>
  <section class="col"><h2>Lichess</h2><div id="lichessList" class="list"><div class="msg">API接続後に検索できます。</div></div><button class="more secondary" data-site="lichess">さらに読み込み</button></section>
  <section class="viewer">
    <div class="viewerHead"><div><div class="viewerTitle" id="viewerTitle">棋譜を選択</div><div class="status" id="viewerMeta">リストの列全体クリックで振り返り。</div></div><button class="secondary" id="flipBtn">反転</button></div>
    <div class="boardWrap"><div id="board" class="board"></div><div id="moves" class="moves"><div class="msg">棋譜未選択</div></div></div>
    <div class="controls"><button class="secondary" id="prevBtn">←</button><button class="secondary" id="nextBtn">→</button><button class="secondary" id="copyPgn">PGNコピー</button></div>
    <div class="analysisBox" id="analysisBox">解析結果なし</div>
  </section>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const apiUrlEl = $('#apiUrl'), apiStatus = $('#apiStatus');
  const lists = { chesscom: $('#chesscomList'), lichess: $('#lichessList') };
  const offsets = { chesscom: 0, lichess: 0 };
  let apiBase = localStorage.getItem('yellowChessApi') || 'http://localhost:3000';
  let apiOk = false, current = null, flipped = false, ply = 0;
  const jobTimers = new Map();
  apiUrlEl.value = apiBase;

  function api(path){ return apiBase.replace(/\/$/,'') + path; }
  function setStatus(text, ok=false){ apiStatus.textContent = text; apiStatus.className = 'status ' + (ok?'ok':'err'); }
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function dateShort(d){ try{return new Date(d).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return ''} }
  function notify(msg){ if(Notification?.permission === 'granted') new Notification(msg); else console.log(msg); }

  async function checkApi(){
    apiBase = apiUrlEl.value.trim().replace(/\/$/,'');
    if(!apiBase){ setStatus('API URLが空です'); apiOk=false; return false; }
    try{
      const r = await fetch(api('/health'));
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      if(!j.ok) throw new Error('health ok=false');
      apiOk = true; setStatus('API接続OK', true); return true;
    }catch(e){ apiOk=false; setStatus('API接続失敗: '+e.message); return false; }
  }
  $('#saveApi').onclick = () => { apiBase = apiUrlEl.value.trim().replace(/\/$/,''); localStorage.setItem('yellowChessApi', apiBase); setStatus('API保存済み。接続確認してください。'); };
  $('#checkApi').onclick = checkApi;

  async function loadSite(site, reset=false){
    if(reset){ offsets[site]=0; lists[site].innerHTML=''; }
    if(!apiOk && !(await checkApi())){ lists[site].innerHTML = '<div class="msg err">APIサーバー未接続です。検索にはAPIが必須です。</div>'; return; }
    const username = $('#username').value.trim();
    if(!username){ lists[site].innerHTML = '<div class="msg err">ユーザー名を入力してください。</div>'; return; }
    const holder = lists[site];
    if(reset) holder.innerHTML = '<div class="msg">取得中...</div>';
    try{
      const r = await fetch(api(`/api/games/${site}/${encodeURIComponent(username)}?offset=${offsets[site]}&limit=10`));
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error || 'HTTP '+r.status);
      if(reset) holder.innerHTML='';
      if(!j.games?.length && offsets[site]===0) holder.innerHTML = '<div class="msg">棋譜が見つかりません。</div>';
      for(const g of j.games||[]) addGameCard(site, g);
      offsets[site] += (j.games||[]).length;
    }catch(e){ if(reset) holder.innerHTML=''; holder.insertAdjacentHTML('beforeend', `<div class="msg err">取得失敗: ${esc(e.message)}</div>`); }
  }
  $('#searchBtn').onclick = () => { loadSite('chesscom', true); loadSite('lichess', true); };
  document.querySelectorAll('.more').forEach(b => b.onclick = () => loadSite(b.dataset.site, false));

  function addGameCard(site, g){
    const card = document.createElement('div'); card.className='game'; card.dataset.gameId=g.id;
    card.innerHTML = `<div class="gameTop"><div class="players">${esc(g.white)} vs ${esc(g.black)}</div><div>${esc(g.result)}</div></div><div class="meta">${esc(g.timeControl||'')} / ${dateShort(g.date)}</div><div class="actions"><button class="analyze">解析 0%</button><button class="showAnalysis" style="display:none">解析済みを見る</button></div>`;
    card.onclick = () => openGame(g, null);
    card.querySelector('.analyze').onclick = (ev) => { ev.stopPropagation(); startAnalyze(g, card); };
    card.querySelector('.showAnalysis').onclick = async (ev) => { ev.stopPropagation(); const a = await getAnalysis(g.id); openGame(g, a); };
    lists[site].appendChild(card);
  }

  async function startAnalyze(g, card){
    if(!apiOk && !(await checkApi())) return;
    if(Notification && Notification.permission === 'default') Notification.requestPermission().catch(()=>{});
    const btn = card.querySelector('.analyze'), show = card.querySelector('.showAnalysis');
    btn.disabled = true; btn.textContent = '待機中';
    try{
      const r = await fetch(api('/api/analyze'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:g.id,pgn:g.pgn,movetime:300})});
      const j = await r.json(); if(!r.ok) throw new Error(j.error||'解析開始失敗');
      if(j.status === 'done'){ btn.textContent='100%'; show.style.display='inline-block'; notify('解析済みデータを表示できます'); return; }
      pollJob(j.jobId, btn, show);
    }catch(e){ btn.disabled=false; btn.textContent='再解析'; alert('解析開始失敗: '+e.message); }
  }
  function pollJob(jobId, btn, show){
    const timer = setInterval(async()=>{
      try{
        const r = await fetch(api('/api/jobs/'+jobId)); const j = await r.json(); if(!r.ok) throw new Error(j.error||'job取得失敗');
        btn.textContent = j.status === 'queued' ? '待機中' : `${j.progress||0}%`;
        if(j.status === 'done'){ clearInterval(timer); btn.textContent='100%'; show.style.display='inline-block'; notify('解析が完了しました'); }
        if(j.status === 'failed'){ clearInterval(timer); btn.disabled=false; btn.textContent='再解析'; alert('解析失敗: '+(j.error||'')); }
      }catch(e){ clearInterval(timer); btn.disabled=false; btn.textContent='再確認'; alert(e.message); }
    }, 1200); jobTimers.set(jobId, timer);
  }
  async function getAnalysis(gameId){ const r=await fetch(api('/api/analysis/'+encodeURIComponent(gameId))); if(!r.ok) return null; return r.json(); }

  function ChessCtor(){ return window.Chess || window.chess?.Chess || window.ChessJS?.Chess; }
  function openGame(g, analysis){
    const C = ChessCtor(); if(!C){ alert('chess.jsを読み込めません。ネットワークを確認してください。'); return; }
    const chess = new C(); try{ chess.loadPgn(g.pgn); }catch(e){ alert('PGNを読み込めません: '+e.message); return; }
    current = { game:g, moves:chess.history({verbose:true}), analysis, positions:[] }; const replay = new C(); current.positions=[replay.fen()]; for(const m of current.moves){ replay.move(m.san); current.positions.push(replay.fen()); }
    ply=0; $('#viewerTitle').textContent = `${g.white} vs ${g.black}`; $('#viewerMeta').textContent = `${g.result} / ${g.timeControl||''} / ${dateShort(g.date)}`; renderMoves(); renderBoard(); renderAnalysis();
  }
  function renderMoves(){
    if(!current){return} const el=$('#moves'); el.innerHTML=''; current.moves.forEach((m,i)=>{ const span=document.createElement('span'); span.className='move'+(i+1===ply?' active':''); span.textContent=(m.color==='w'?Math.floor(i/2)+1+'. ':'')+m.san; span.onclick=()=>{ply=i+1;renderBoard();renderMoves();renderAnalysis();}; el.appendChild(span); });
  }
  const pieces={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',P:'♙',R:'♖',N:'♘',B:'♗',Q:'♕',K:'♔'};
  function renderBoard(){
    const board=$('#board'); board.innerHTML=''; const C=ChessCtor(); const c=new C(current?.positions?.[ply] || undefined); const rows=c.board();
    for(let rr=0;rr<8;rr++) for(let cc=0;cc<8;cc++){ const r=flipped?7-rr:rr, col=flipped?7-cc:cc, p=rows[r][col]; const sq=document.createElement('div'); sq.className='sq '+(((r+col)%2)?'dark':'light'); sq.textContent=p?pieces[p.color==='w'?p.type.toUpperCase():p.type]:''; if(rr===7||cc===0){ const file='abcdefgh'[col], rank=8-r; sq.insertAdjacentHTML('beforeend',`<span class="coord">${cc===0?rank:''}${rr===7?file:''}</span>`); } board.appendChild(sq); }
  }
  function renderAnalysis(){
    const box=$('#analysisBox'); if(!current?.analysis){ box.textContent='解析結果なし'; return; }
    const items=current.analysis.results||[]; const row=items[ply-1]; if(!row){ box.textContent='初期局面です。'; return; }
    box.innerHTML=`<b>${esc(row.label)}</b> / 評価差 ${esc(row.dropCp)}cp<br>最善手: ${esc(row.bestMove||'')}<br>PV: ${esc((row.pv||[]).join(' '))}<br><div class="bar"><div style="width:${Math.min(100, Math.abs(row.afterWhiteCp||0)/12)}%"></div></div>`;
  }
  $('#prevBtn').onclick=()=>{ if(current&&ply>0){ply--;renderBoard();renderMoves();renderAnalysis();} };
  $('#nextBtn').onclick=()=>{ if(current&&ply<current.moves.length){ply++;renderBoard();renderMoves();renderAnalysis();} };
  $('#flipBtn').onclick=()=>{ flipped=!flipped; if(current) renderBoard(); };
  $('#copyPgn').onclick=()=>{ if(current) navigator.clipboard.writeText(current.game.pgn).catch(()=>{}); };
  checkApi();
})();
</script>
</body>
</html>
